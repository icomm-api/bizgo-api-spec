name: ci

on:
  push:
    branches: [main]
  pull_request:

# 최소 권한 원칙: 읽기만 허용
permissions:
  contents: read

jobs:
  spec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: lint + bundle + dist 최신 여부
        run: npm run lint && npm run bundle && git diff --exit-code -- dist/
      - name: 요청 예시 조건부 필수(x-sdk-required-if) 검사
        run: npm run examples
      - name: Postman·Bruno 컬렉션 최신 여부 (dist/openapi.yaml에서 다시 생성해 비교)
        run: npm run collections:check

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks (전체 히스토리)
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.18.4@sha256:75bdb2b2f4db213cde0b8295f13a88d6b333091bbfbf3012a4e083d00d31caba \
            detect --source /repo --config /repo/.gitleaks.toml --redact --verbose

  tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: 오프라인 단위 테스트 (네트워크·키 불필요)
        run: python -m unittest discover -s tools/sandbox-check -p "test_*.py" -v
