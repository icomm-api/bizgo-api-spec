get:
  operationId: getKakaoSender
  tags: [Kakao]
  summary: 발신프로필 키로 조회
  description: 발신프로필 키를 기준으로 카카오 발신프로필 정보를 조회합니다. 알림톡, 브랜드메시지, 상담톡에서 사용하는 senderKey의 상태(차단·휴면·스팸 등)를 확인할 때 사용합니다.
  x-source: https://developers.bizgo.io/api-sdk/api-reference/comm/kakao-common
  x-sdk-resource: kakao.senders
  x-sdk-method: get
  x-sdk-retry: safe
  x-sdk-result: data.data.kakao.senderProfile
  parameters:
    - name: senderKey
      in: query
      required: true
      description: 발신프로필 키입니다.
      schema:
        type: string
      example: SENDER_KEY_EXAMPLE
  responses:
    "200":
      description: 발신프로필 정보입니다.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/KakaoSenderResponse.yaml
          example:
            common:
              authCode: A000
              authResult: Success
              infobankTrId: Infobank-Tracking-Id
            data:
              code: A000
              result: Success
              data:
                kakao:
                  senderProfile:
                    senderKey: SENDER_KEY_EXAMPLE
                    name: 비즈고
                    status: A
                    block: false
                    dormant: false
                    profileStatus: A
                    createdAt: "2026-04-24T11:18:45+09:00"
                    modifiedAt: "2026-04-24T11:18:45+09:00"
                    bizchat: true
                    brandMessage: true
                    businessProfile: true
                    profileSpamLevel: 정상
                    profileMessageSpamLevel: 정상
    "429":
      $ref: ../components/responses/RateLimited.yaml
    default:
      $ref: ../components/responses/ErrorResponse.yaml
