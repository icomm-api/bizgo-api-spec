post:
  operationId: createBrandMessageFriendGroup
  summary: "친구 그룹 등록"
  description: "친구 그룹을 생성합니다. `fileKey` 또는 `phoneNumbers`로 그룹에 넣을 전화번호를 함께 등록할 수 있습니다. 처리는 비동기이며 응답의 `status`는 `IN_PROGRESS`일 수 있습니다."
  tags: [BrandMessage]
  x-source: "https://developers.bizgo.io/api-sdk/api-reference/comm/kakao-brand"
  x-sdk-resource: brandMessage.friendGroups
  x-sdk-method: create
  x-sdk-retry: rate_limit_only
  requestBody:
    required: true
    content:
      "application/json":
        schema:
          $ref: "../components/schemas/BrandMessageFriendGroupRequest.yaml"
  responses:
    "200":
      description: "친구 그룹 등록 요청 결과입니다."
      content:
        "application/json":
          schema:
            $ref: "../components/schemas/BrandMessageFriendGroupProcessingResponse.yaml"
    "429":
      $ref: "../components/responses/RateLimited.yaml"
    default:
      $ref: "../components/responses/ErrorResponse.yaml"
get:
  operationId: getBrandMessageFriendGroup
  summary: "친구 그룹 조회"
  description: "발신프로필 키와 친구 그룹 키로 친구 그룹 상세 정보를 조회합니다."
  tags: [BrandMessage]
  x-source: "https://developers.bizgo.io/api-sdk/api-reference/comm/kakao-brand"
  x-sdk-resource: brandMessage.friendGroups
  x-sdk-method: get
  x-sdk-retry: safe
  parameters:
    - name: senderKey
      in: query
      required: true
      description: "발신프로필 키입니다."
      schema:
        type: string
      example: SENDER_KEY_EXAMPLE
    - name: friendGroupKey
      in: query
      required: true
      description: "친구 그룹 키입니다."
      schema:
        type: string
      example: FRIEND_GROUP_KEY_EXAMPLE
  responses:
    "200":
      description: "친구 그룹 상세 정보입니다."
      content:
        "application/json":
          schema:
            $ref: "../components/schemas/BrandMessageFriendGroupResponse.yaml"
    "429":
      $ref: "../components/responses/RateLimited.yaml"
    default:
      $ref: "../components/responses/ErrorResponse.yaml"
