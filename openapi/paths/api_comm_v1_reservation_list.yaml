get:
  operationId: listReservations
  tags: [Reservation]
  summary: 예약 목록 조회
  description: 예약 발송 건 목록을 조회합니다. `resvSendTime`에 지정한 시각을 포함해 그 이후의 예약 건이 조회됩니다.
  x-source: https://developers.bizgo.io/api-sdk/api-reference/comm/reservation
  x-sdk-resource: reservations
  x-sdk-method: list
  x-sdk-retry: safe
  x-sdk-pagination:
    style: cursor
    request: lastSeq
    response: data.data.lastSeq
    hasNext: data.data.hasNext
    items: data.data.reservations
  parameters:
    - name: resvSendTime
      in: query
      required: true
      description: 조회 기준 예약 발송 시각입니다. `yyyy-MM-dd HH:mm:ss` 형식만 쓸 수 있습니다.
      schema:
        type: string
        x-format: "yyyy-MM-dd HH:mm:ss"
      example: "2026-05-01 10:00:00"
    - name: paymentCode
      in: query
      required: false
      description: 정산 코드로 조회 대상을 거릅니다.
      schema:
        type: string
    - name: lastSeq
      in: query
      required: false
      description: 다음 페이지를 조회할 때 쓰는 마지막 순번입니다. 이전 응답의 `data.data.lastSeq`를 넣습니다.
      schema:
        type: integer
        format: int64
    - name: limit
      in: query
      required: false
      description: 조회 건수입니다.
      schema:
        type: integer
        minimum: 1
      x-unverified: "limit의 기본값과 최대값이 문서에 없습니다."
  responses:
    "200":
      description: 예약 목록입니다.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ReservationListResponse.yaml
          example:
            common:
              authCode: A000
              authResult: Success
              infobankTrId: Infobank-Tracking-Id
            data:
              code: A000
              result: Success
              data:
                lastSeq: 100
                hasNext: false
                reservations:
                  - seq: 100
                    resvKey: RESV_KEY_EXAMPLE
                    paymentCode: PAYMENT_CODE_EXAMPLE
                    resvName: 금요일 캠페인
                    productType: MESSAGE
                    status: PENDING
                    adYn: N
                    resvSendTime: "2026-05-01 10:00:00"
                    expectedCnt: 1000
                    sentCnt: 0
                    successCnt: 0
                    failCnt: 0
                    updateDate: "2026-04-30 12:34:56"
                    regDate: "2026-04-30 12:00:00"
    "429":
      $ref: ../components/responses/RateLimited.yaml
    default:
      $ref: ../components/responses/ErrorResponse.yaml
