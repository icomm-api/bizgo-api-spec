get:
  operationId: getCounselConsultTime
  tags: [Counsel]
  summary: 상담시간 조회
  description: |
    상담 운영 시간(요일별)을 조회합니다.

    상담톡 요청·응답에는 최종 사용자 식별자(`userKey`)와 상담 내용이 들어가므로 개인정보로 취급하고 본문을 로그에 남기지 않습니다.
  x-source: https://developers.bizgo.io/api-sdk/api-reference/comm/kakao-counsel
  x-sdk-resource: counsel.consultTime
  x-sdk-method: get
  x-sdk-retry: safe
  parameters:
    - name: senderKey
      in: query
      required: true
      description: 카카오 비즈메시지 발신프로필 키입니다.
      schema:
        type: string
      example: SENDER_KEY_EXAMPLE
  responses:
    "200":
      description: 상담시간입니다.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/CounselConsultTimeResponse.yaml
          example:
            common:
              authCode: A000
              authResult: Success
              infobankTrId: Infobank-Tracking-Id
            data:
              code: A000
              result: Success
              data:
                cstalk:
                  weekTimeTable:
                    - day: mon
                      startAt: "0900"
                      endAt: "1800"
    "429":
      $ref: ../components/responses/RateLimited.yaml
    default:
      $ref: ../components/responses/ErrorResponse.yaml
post:
  operationId: saveCounselConsultTime
  tags: [Counsel]
  summary: 상담시간 저장
  description: |
    카카오톡 채널의 상담시간을 저장합니다. 한 번 등록하면 수정만 가능하며, 상담톡 이용을 해지하면 삭제됩니다.
    상담시간은 카카오톡 채널 홈에 노출되며, 확인하려면 채팅 기능이 활성화되어 있어야 합니다.

    상담톡 요청·응답에는 최종 사용자 식별자(`userKey`)와 상담 내용이 들어가므로 개인정보로 취급하고 본문을 로그에 남기지 않습니다.
  x-source: https://developers.bizgo.io/api-sdk/api-reference/comm/kakao-counsel
  x-sdk-resource: counsel.consultTime
  x-sdk-method: save
  x-sdk-retry: rate_limit_only
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/CounselConsultTimeSaveRequest.yaml
        examples:
          weekday:
            summary: 월요일 상담시간
            value:
              cstalk:
                senderKey: SENDER_KEY_EXAMPLE
                weekTimeTable:
                  - day: mon
                    startAt: "0900"
                    endAt: "1800"
  responses:
    "200":
      description: 처리 결과입니다.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ApiResponse.yaml
          example:
            common:
              authCode: A000
              authResult: Success
              infobankTrId: Infobank-Tracking-Id
            data:
              code: A000
              result: Success
    "429":
      $ref: ../components/responses/RateLimited.yaml
    default:
      $ref: ../components/responses/ErrorResponse.yaml
