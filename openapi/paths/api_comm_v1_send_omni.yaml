post:
  operationId: sendOmni
  tags: [Send]
  summary: 통합 발송
  description: |
    SMS/LMS/MMS, 국제, RCS, 알림톡, 브랜드메시지, 네이버 톡톡을 같은 경로로 발송합니다.
    채널은 `messageFlow[]`의 채널 키로 구분하며, 여러 개를 넣으면 앞 메시지가 실패할 때 다음 메시지로 대체발송됩니다.
    수신자는 한 요청에 최대 200명입니다. 접수 결과는 수신자별로 `data.data.destinations[]`에 담기며,
    최종 발송 결과는 리포트(Polling/Webhook/Inquiry)로 확인합니다.

    중복 발송 방지용 멱등성 키 필드(선택)는 요청 스키마 설명을 참고합니다.
  x-source: https://developers.bizgo.io/api-sdk/api-reference/comm/mt
  x-sdk-resource: send
  x-sdk-method: omni
  x-sdk-retry: rate_limit_only
  x-sdk-rate: send
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/SendOmniRequest.yaml
        examples:
          sms:
            summary: SMS (단문)
            description: 90byte 이하 단문 문자입니다.
            value:
              destinations:
                - to: "01000000000"
              messageFlow:
                - sms:
                    from: "01000000000"
                    text: 인증번호는 123456 입니다.
              ref: sms-20260330-001
          lms:
            summary: LMS (장문)
            description: "`mms` 키에 `fileKey` 없이 보내면 LMS로 발송됩니다."
            value:
              destinations:
                - to: "01000000000"
              messageFlow:
                - mms:
                    from: "01000000000"
                    title: 주문 안내
                    text: 주문이 정상 접수되었습니다. 배송은 내일부터 시작됩니다.
              ref: lms-20260330-001
          mms:
            summary: MMS (이미지+장문)
            description: 이미지 업로드(`POST /api/comm/v1/file/mms`)로 받은 파일 키를 `fileKey`에 넣습니다(최대 3개).
            value:
              destinations:
                - to: "01000000000"
              messageFlow:
                - mms:
                    from: "01000000000"
                    title: 이벤트 안내
                    text: 이번 주 이벤트 안내 이미지를 확인해 주세요.
                    fileKey: [FILE_KEY_EXAMPLE]
              ref: mms-20260330-001
          international:
            summary: 국제메시지
            description: 수신번호는 국가번호를 포함한 E.164 형식에서 `+`를 뺀 숫자로 씁니다. `title`, `fileKey`는 쓸 수 없습니다.
            value:
              destinations:
                - to: "821000000000"
              messageFlow:
                - international:
                    from: "01000000000"
                    text: Your verification code is 000000.
              ref: international-20260330-001
          rcs:
            summary: RCS (통합 RCS)
            description: iOS·안드로이드를 함께 지원하는 통합 RCS입니다. 본문 항목은 `formatId`로 지정한 포맷에 따라 다릅니다.
            value:
              destinations:
                - to: "01000000000"
              messageFlow:
                - rcs:
                    from: "01000000000"
                    formatId: RCS_FORMAT_ID
                    brandKey: RCS_BRAND_KEY
                    body:
                      title: 통합 RCS 안내
                      description: 통합 RCS 본문입니다.
              ref: rcs-unified-20260330-001
          rcs_image_buttons:
            summary: RCS (이미지·버튼)
            description: "`body.media`에는 이미지 업로드(`POST /api/comm/v1/file/rcs`)로 받은 `media` 값을 넣습니다. 버튼은 `buttons[].suggestions[]`로 정의합니다."
            value:
              destinations:
                - to: "01000000000"
              messageFlow:
                - rcs:
                    from: "01000000000"
                    formatId: RCS_FORMAT_ID
                    brandKey: RCS_BRAND_KEY
                    body:
                      title: 신상품 안내
                      description: 이번 주 신상품을 확인해 보세요.
                      media: maapfile://MEDIA_KEY_EXAMPLE
                    buttons:
                      - suggestions:
                          - displayText: 자세히 보기
                            action:
                              urlAction:
                                openUrl:
                                  url: https://example.com
                          - displayText: 전화 문의
                            action:
                              dialerAction:
                                dialPhoneNumber:
                                  phoneNumber: "01000000000"
                    expiryOption: "1"
              ref: rcs-rich-20260330-001
          rcs_android:
            summary: RCS (안드로이드 RCS, 광고 표시)
            description: 기존 안드로이드 채팅+ 연동 규격입니다. `header`가 `1`(광고 표시)이면 `footer`(수신거부 번호)가 필수입니다.
            value:
              destinations:
                - to: "01000000000"
              messageFlow:
                - rcs:
                    from: "01000000000"
                    formatId: RCS_FORMAT_ID
                    brandKey: RCS_BRAND_KEY
                    body:
                      title: RCS 안내
                      description: 안드로이드 RCS 메시지입니다.
                    copyAllowed: "0"
                    header: "1"
                    footer: UNSUBSCRIBE_NUMBER_EXAMPLE
              ref: rcs-android-20260330-001
          alimtalk:
            summary: 알림톡 (전문 발송)
            description: 템플릿 전문을 직접 넣습니다. `msgType`과 `text`가 필수이며, 버튼은 템플릿에 등록된 것과 같아야 합니다.
            value:
              destinations:
                - to: "01000000000"
                  replaceWords:
                    name: 홍길동
              messageFlow:
                - alimtalk:
                    msgType: AT
                    senderKey: SENDER_KEY_EXAMPLE
                    templateCode: TEMPLATE_CODE_EXAMPLE
                    text: "#{name}님의 예약이 접수되었습니다."
                    attachment:
                      button:
                        - type: WL
                          name: 예약 조회
                          urlMobile: https://m.example.com/reservation
                          urlPc: https://example.com/reservation
              ref: alimtalk-at-20260330-001
          alimtalk_template:
            summary: 알림톡 (템플릿 자동 치환 발송)
            description: "`sendType: template`이면 `senderKey`, `templateCode`만 보내고 비즈고가 전문을 만듭니다. `destinations[].replaceWords`가 필수입니다."
            value:
              destinations:
                - to: "01000000000"
                  replaceWords:
                    name: 홍길동
                    orderName: 비즈고 이용권
                    status: 결제완료
              messageFlow:
                - alimtalk:
                    senderKey: SENDER_KEY_EXAMPLE
                    templateCode: TEMPLATE_CODE_EXAMPLE
                    sendType: template
              ref: alimtalk-template-20260330-001
          alimtalk_image:
            summary: 알림톡 (이미지형)
            description: "`msgType: AI` 전문 발송입니다. 이미지를 지정하는 발송 필드는 문서에 없으며 템플릿에 등록된 이미지가 쓰이는 것으로 보입니다(스펙 `x-unverified`)."
            value:
              destinations:
                - to: "01000000000"
                  replaceWords:
                    name: 홍길동
              messageFlow:
                - alimtalk:
                    msgType: AI
                    senderKey: SENDER_KEY_EXAMPLE
                    templateCode: TEMPLATE_CODE_EXAMPLE
                    text: "#{name}님, 이벤트 당첨을 축하드립니다."
              ref: alimtalk-ai-20260330-001
          brandmessage_basic:
            summary: 브랜드메시지 (기본형)
            description: 사전 승인된 기본형 템플릿으로 발송합니다. `msgType`, `templateCode`, `targeting`이 필수입니다.
            value:
              destinations:
                - to: "01000000000"
              messageFlow:
                - brandmessage:
                    sendType: basic
                    msgType: FT
                    senderKey: SENDER_KEY_EXAMPLE
                    templateCode: TEMPLATE_CODE_EXAMPLE
                    targeting: M
              ref: brand-basic-20260330-001
          brandmessage_template:
            summary: 브랜드메시지 (기본형 템플릿 자동 치환)
            description: "`sendType: template`이면 템플릿 코드와 `destinations[].replaceWords`만으로 발송합니다."
            value:
              destinations:
                - to: "01000000000"
                  replaceWords:
                    customerName: 홍길동
                    point: "500"
              messageFlow:
                - brandmessage:
                    sendType: template
                    senderKey: SENDER_KEY_EXAMPLE
                    templateCode: TEMPLATE_CODE_EXAMPLE
                    targeting: I
                    pushAlarm: "Y"
              ref: brand-template-20260330-001
          brandmessage_free_text:
            summary: 브랜드메시지 (자유형 텍스트)
            description: "템플릿 없이 본문과 버튼을 직접 구성합니다(`msgType: FT`, 본문 최대 1,300자)."
            value:
              destinations:
                - to: "01000000000"
              messageFlow:
                - brandmessage:
                    sendType: free
                    msgType: FT
                    senderKey: SENDER_KEY_EXAMPLE
                    text: 자유형 브랜드메시지 본문입니다.
                    attachment:
                      button:
                        - type: WL
                          name: 자세히 보기
                          urlMobile: https://m.example.com
                          urlPc: https://example.com
              ref: brand-free-ft-20260330-001
          brandmessage_free_image:
            summary: 브랜드메시지 (자유형 이미지)
            description: "`msgType: FI`는 `attachment.image`가 필수이며 본문은 최대 400자입니다. `imgUrl`은 브랜드메시지 이미지 업로드로 받은 값을 씁니다."
            value:
              destinations:
                - to: "01000000000"
              messageFlow:
                - brandmessage:
                    sendType: free
                    msgType: FI
                    senderKey: SENDER_KEY_EXAMPLE
                    text: 이번 주 이벤트를 확인해 보세요.
                    attachment:
                      image:
                        imgUrl: https://example.com/IMAGE_URL_EXAMPLE.jpg
                        imgLink: https://example.com/event
              ref: brand-free-fi-20260330-001
          brandmessage_free_wide:
            summary: 브랜드메시지 (자유형 와이드 이미지)
            description: "`msgType: FW`는 `attachment.image`가 필수이며 본문은 최대 76자입니다."
            value:
              destinations:
                - to: "01000000000"
              messageFlow:
                - brandmessage:
                    sendType: free
                    msgType: FW
                    senderKey: SENDER_KEY_EXAMPLE
                    text: 와이드 이미지 이벤트 안내입니다.
                    attachment:
                      image:
                        imgUrl: https://example.com/WIDE_IMAGE_URL_EXAMPLE.jpg
                      button:
                        - type: WL
                          name: 이벤트 보기
                          urlMobile: https://m.example.com/event
                          urlPc: https://example.com/event
              ref: brand-free-fw-20260330-001
          brandmessage_free_carousel:
            summary: 브랜드메시지 (자유형 캐러셀 피드)
            description: "`msgType: FC`는 `carousel.list`(2~10개)를 쓰며, 아이템마다 `header`, `message`, `attachment.image`가 필수입니다. `carousel.head`는 쓸 수 없습니다."
            value:
              destinations:
                - to: "01000000000"
              messageFlow:
                - brandmessage:
                    sendType: free
                    msgType: FC
                    senderKey: SENDER_KEY_EXAMPLE
                    carousel:
                      list:
                        - header: 첫 번째 상품
                          message: 첫 번째 상품 소개입니다.
                          attachment:
                            image:
                              imgUrl: https://example.com/CAROUSEL_IMAGE_URL_EXAMPLE_1.jpg
                            button:
                              - type: WL
                                name: 상품 보기
                                urlMobile: https://m.example.com/item/1
                                urlPc: https://example.com/item/1
                        - header: 두 번째 상품
                          message: 두 번째 상품 소개입니다.
                          attachment:
                            image:
                              imgUrl: https://example.com/CAROUSEL_IMAGE_URL_EXAMPLE_2.jpg
                            button:
                              - type: WL
                                name: 상품 보기
                                urlMobile: https://m.example.com/item/2
                                urlPc: https://example.com/item/2
                      tail:
                        urlMobile: https://m.example.com/items
              ref: brand-free-fc-20260330-001
          navertalk:
            summary: 네이버 톡톡 (스마트알림)
            description: 네이버 스마트알림 템플릿 기반 정보성 메시지입니다. `partnerKey`, `templateCode`, `productCode`가 필수입니다.
            value:
              destinations:
                - to: "01000000000"
              messageFlow:
                - navertalk:
                    partnerKey: PARTNER_KEY_EXAMPLE
                    templateCode: TEMPLATE_CODE_EXAMPLE
                    productCode: INFORMATION
                    text: 네이버 톡톡 메시지 본문입니다.
                    attachments:
                      buttons:
                        - buttonCode: WEB_LINK
                          mobileUrl: https://m.example.com
                          pcUrl: https://example.com
              ref: navertalk-20260330-001
          fallback:
            summary: 대체발송 (알림톡 → SMS)
            description: 알림톡이 실패하면 `messageFlow`의 다음 메시지(SMS)로 자동 대체발송됩니다.
            value:
              destinations:
                - to: "01000000000"
                  replaceWords:
                    name: 홍길동
              messageFlow:
                - alimtalk:
                    senderKey: SENDER_KEY_EXAMPLE
                    templateCode: TEMPLATE_CODE_EXAMPLE
                    msgType: AT
                    text: "#{name}님, 주문이 접수되었습니다."
                - sms:
                    from: "01000000000"
                    text: "#{name}님, 주문이 접수되었습니다."
              ref: fallback-at-sms-20260330-001
          fallback_rcs_lms:
            summary: 대체발송 (RCS → LMS)
            description: RCS가 실패하면 LMS로 대체발송됩니다.
            value:
              destinations:
                - to: "01000000000"
              messageFlow:
                - rcs:
                    from: "01000000000"
                    formatId: RCS_FORMAT_ID
                    brandKey: RCS_BRAND_KEY
                    body:
                      title: 배송 안내
                      description: 주문하신 상품이 오늘 출고됩니다.
                - mms:
                    from: "01000000000"
                    title: 배송 안내
                    text: 주문하신 상품이 오늘 출고됩니다.
              ref: fallback-rcs-lms-20260330-001
          bulk_replace_words:
            summary: 동보 발송 (수신자별 치환)
            description: 한 요청에 수신자를 최대 200명까지 넣습니다. 본문의 `#{key}`는 수신자별 `replaceWords` 값으로 바뀌고, 수신자별 `ref`는 리포트에 담깁니다.
            value:
              destinations:
                - to: "01000000000"
                  replaceWords:
                    name: 홍길동
                    point: "500"
                  ref: member-0001
                - to: "01000000001"
                  replaceWords:
                    name: 김철수
                    point: "1200"
                  ref: member-0002
              messageFlow:
                - mms:
                    from: "01000000000"
                    title: 포인트 안내
                    text: "#{name}님, 적립 포인트는 #{point}점입니다."
              ref: bulk-20260330-001
  responses:
    "200":
      description: 접수 결과입니다. 수신자별 `code`도 함께 확인합니다.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/SendOmniResponse.yaml
          example:
            common:
              authCode: A000
              authResult: Success
              infobankTrId: Infobank-Tracking-Id
            data:
              code: A000
              result: SUCCESS
              data:
                destinations:
                  - to: "01000000000"
                    msgKey: 20260424104234546POM101182450000
                    code: A000
                    result: Success
              ref: sms-20260330-001
    "429":
      $ref: ../components/responses/RateLimited.yaml
    default:
      $ref: ../components/responses/ErrorResponse.yaml
