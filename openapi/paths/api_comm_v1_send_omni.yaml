post:
  operationId: sendOmni
  tags: [Send]
  summary: 통합 발송
  description: |
    SMS/LMS/MMS, 국제, RCS, 알림톡, 브랜드메시지, 네이버 톡톡을 같은 경로로 발송합니다.
    채널은 `messageFlow[]`의 채널 키로 구분하며, 여러 개를 넣으면 앞 메시지가 실패할 때 다음 메시지로 대체발송됩니다.
    수신자는 한 요청에 최대 200명입니다. 접수 결과는 수신자별로 `data.data.destinations[]`에 담기며,
    최종 발송 결과는 리포트(Polling/Webhook/Inquiry)로 확인합니다.

    네트워크 오류로 결과를 모를 때 다시 보내면 중복 발송될 수 있으므로 `idempotencyKey`를 함께 씁니다. `idempotencyKey`를 보낼 때는 `idempotencyTtl`도 함께 보내야 합니다(없으면 A309).
  x-source: https://developers.bizgo.io/api-sdk/api-reference/comm/mt
  x-sdk-resource: send
  x-sdk-method: omni
  x-sdk-retry: rate_limit_only
  x-sdk-rate: send
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/SendOmniRequest.yaml
        examples:
          sms:
            summary: SMS 발송
            value:
              destinations:
                - to: "01000000000"
              messageFlow:
                - sms:
                    from: "01000000000"
                    text: 인증번호는 123456 입니다.
              ref: sms-20260330-001
          lms:
            summary: LMS 발송
            value:
              destinations:
                - to: "01000000000"
              messageFlow:
                - mms:
                    from: "01000000000"
                    title: 주문 안내
                    text: 주문이 정상 접수되었습니다. 배송은 내일부터 시작됩니다.
              ref: lms-20260330-001
          fallback:
            summary: 알림톡 실패 시 SMS로 대체발송
            value:
              destinations:
                - to: "01000000000"
                  replaceWords:
                    name: 홍길동
              messageFlow:
                - alimtalk:
                    senderKey: SENDER_KEY_EXAMPLE
                    templateCode: TEMPLATE_CODE_EXAMPLE
                    msgType: AT
                    text: "#{name}님, 주문이 접수되었습니다."
                - sms:
                    from: "01000000000"
                    text: "#{name}님, 주문이 접수되었습니다."
              idempotencyKey: order-20260330-0001
              idempotencyTtl: 86400
  responses:
    "200":
      description: 접수 결과입니다. 수신자별 `code`도 함께 확인합니다.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/SendOmniResponse.yaml
          example:
            common:
              authCode: A000
              authResult: Success
              infobankTrId: Infobank-Tracking-Id
            data:
              code: A000
              result: SUCCESS
              data:
                destinations:
                  - to: "01000000000"
                    msgKey: 20260424104234546POM101182450000
                    code: A000
                    result: Success
              ref: sms-20260330-001
    "429":
      $ref: ../components/responses/RateLimited.yaml
    default:
      $ref: ../components/responses/ErrorResponse.yaml
