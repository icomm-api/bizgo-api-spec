get:
  operationId: listAlimtalkTemplates
  tags: [Alimtalk]
  summary: 알림톡 템플릿 목록 조회
  description: 발신프로필에 등록된 알림톡 템플릿 목록을 페이징 조회합니다. 카카오를 호출하지 않고 비즈고에 적재된 템플릿을 읽으므로 목록 화면이나 주기적인 동기화에 사용할 수 있습니다.
  x-source: https://developers.bizgo.io/api-sdk/api-reference/comm/kakao-alimtalk
  x-unverified: "이 엔드포인트는 한국어 페이지(Part A)에만 있습니다. offset이 건수 기준인지, limit 기본값·최대값, 마지막 페이지 판별 방법(hasNext·total 없음)이 문서에 없습니다."
  x-sdk-resource: alimtalk.templates
  x-sdk-method: list
  x-sdk-retry: safe
  x-sdk-result: data.data.alimtalk.templates
  x-sdk-pagination:
    style: offset
    request: offset
    size: limit
    items: data.data.alimtalk.templates
  parameters:
    - name: senderKey
      in: query
      required: true
      description: 발신프로필 키 또는 그룹키입니다.
      schema:
        type: string
      example: SENDER_KEY_EXAMPLE
    - name: senderKeyType
      in: query
      required: false
      description: 발신키 유형입니다(`S` 발신프로필, `G` 그룹).
      schema:
        type: string
        enum: [G, S]
      example: S
    - name: status
      in: query
      required: false
      description: 템플릿 상태입니다.
      schema:
        type: string
      x-unverified: "템플릿 상태 값 목록이 문서에 없습니다."
    - name: inspectionStatus
      in: query
      required: false
      description: 검수 상태입니다(`REG` 등록, `REQ` 검수 요청, `APR` 승인, `REJ` 반려).
      schema:
        type: string
        enum: [REG, REQ, APR, REJ]
      example: APR
    - name: templateType
      in: query
      required: false
      description: 템플릿 유형입니다.
      schema:
        type: string
      x-unverified: "템플릿 유형 값 목록이 문서에 없습니다."
    - name: offset
      in: query
      required: false
      description: 조회 시작 위치입니다. 문서 예시는 `0`입니다.
      schema:
        type: integer
        minimum: 0
      example: 0
    - name: limit
      in: query
      required: false
      description: 조회 건수입니다. 문서 예시는 `100`입니다.
      schema:
        type: integer
        minimum: 1
      example: 100
  responses:
    "200":
      description: 템플릿 목록입니다.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/AlimtalkTemplateListResponse.yaml
          example:
            common:
              authCode: A000
              authResult: Success
              infobankTrId: Infobank-Tracking-Id
            data:
              code: A000
              result: Success
              data:
                alimtalk:
                  templates:
                    - senderKey: SENDER_KEY_EXAMPLE
                      templateName: 주문 완료 안내
                      templateCode: TEMPLATE_CODE_EXAMPLE
                      templateMessageType: BA
                      templateEmphasizeType: NONE
                      text: "#{name}님, 주문이 완료되었습니다."
                      categoryCode: "001001"
                      inspectionStatus: APR
                      status: A
    "429":
      $ref: ../components/responses/RateLimited.yaml
    default:
      $ref: ../components/responses/ErrorResponse.yaml
