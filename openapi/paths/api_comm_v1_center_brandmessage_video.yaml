get:
  operationId: getBrandMessageVideo
  summary: "브랜드메시지 동영상 조회"
  description: "동영상 식별자로 업로드된 동영상 한 건의 처리 상태와 메타 정보를 조회합니다."
  tags: [BrandMessage]
  x-source: "https://developers.bizgo.io/api-sdk/api-reference/comm/kakao-brand"
  x-sdk-resource: brandMessage.videos
  x-sdk-method: get
  x-sdk-retry: safe
  parameters:
    - name: vid
      in: query
      required: true
      description: "조회할 동영상 식별자입니다."
      schema:
        type: string
      example: VID_EXAMPLE
    - name: senderKey
      in: query
      required: true
      description: "발신프로필 키입니다. 최대 40자입니다."
      schema:
        type: string
        maxLength: 40
      example: SENDER_KEY_EXAMPLE
  responses:
    "200":
      description: "동영상 정보입니다."
      content:
        "application/json":
          schema:
            $ref: "../components/schemas/BrandMessageVideoInfoResponse.yaml"
    "429":
      $ref: "../components/responses/RateLimited.yaml"
    default:
      $ref: "../components/responses/ErrorResponse.yaml"
