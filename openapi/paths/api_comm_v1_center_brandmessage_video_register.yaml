post:
  operationId: registerBrandMessageExistingVideo
  summary: "브랜드메시지 기존 동영상 등록"
  description: "카카오톡 채널에 이미 올라가 있는 동영상을 재업로드 없이 브랜드메시지 발송용으로 등록합니다. `vid` 또는 `videoUrl` 중 하나만 지정합니다."
  tags: [BrandMessage]
  x-source: "https://developers.bizgo.io/api-sdk/api-reference/comm/kakao-brand"
  x-sdk-resource: brandMessage.videos
  x-sdk-method: registerExisting
  x-sdk-retry: rate_limit_only
  requestBody:
    required: true
    content:
      "application/json":
        schema:
          $ref: "../components/schemas/BrandMessageVideoRegisterRequest.yaml"
  responses:
    "200":
      description: "등록된 동영상 정보입니다."
      content:
        "application/json":
          schema:
            $ref: "../components/schemas/BrandMessageVideoInfoResponse.yaml"
    "429":
      $ref: "../components/responses/RateLimited.yaml"
    default:
      $ref: "../components/responses/ErrorResponse.yaml"
