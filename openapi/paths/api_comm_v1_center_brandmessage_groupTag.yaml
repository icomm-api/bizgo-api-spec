get:
  operationId: getBrandMessageGroupTag
  summary: "브랜드메시지 그룹태그 조회"
  description: "발신프로필 키와 그룹태그 키로 그룹태그 상세 정보를 조회합니다."
  tags: [BrandMessage]
  x-source: "https://developers.bizgo.io/api-sdk/api-reference/comm/kakao-brand"
  x-sdk-resource: brandMessage.groupTags
  x-sdk-method: get
  x-sdk-retry: safe
  parameters:
    - name: senderKey
      in: query
      required: true
      description: "발신프로필 키입니다."
      schema:
        type: string
      example: SENDER_KEY_EXAMPLE
    - name: groupTagKey
      in: query
      required: true
      description: "그룹태그 키입니다."
      schema:
        type: string
      example: GROUP_TAG_KEY_EXAMPLE
  responses:
    "200":
      description: "그룹태그 정보입니다(`groupTags` 배열)."
      content:
        "application/json":
          schema:
            $ref: "../components/schemas/BrandMessageGroupTagListResponse.yaml"
    "429":
      $ref: "../components/responses/RateLimited.yaml"
    default:
      $ref: "../components/responses/ErrorResponse.yaml"
