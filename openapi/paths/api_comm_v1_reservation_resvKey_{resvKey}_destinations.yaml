parameters:
  - $ref: ../components/parameters/ResvKeyPath.yaml
post:
  operationId: addReservationRecipients
  tags: [Reservation]
  summary: 예약 수신자 추가
  description: 기존 예약 건에 수신자를 추가합니다. 한 번에 최대 1,000건까지 추가할 수 있습니다. 수신자별 `code`를 함께 확인합니다.
  x-source: https://developers.bizgo.io/api-sdk/api-reference/comm/reservation
  x-sdk-resource: reservations.recipients
  x-sdk-method: create
  x-sdk-retry: rate_limit_only
  x-sdk-rate: send
  x-unverified: "수신자를 추가할 수 있는 예약 상태(PENDING만인지)와 예약 1건의 전체 수신자 상한이 문서에 없습니다."
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/ReservationRecipientCreateRequest.yaml
        example:
          destinations:
            - to: "01000000000"
              replaceWords:
                name: 홍길동
              ref: dest-001
  responses:
    "200":
      description: 수신자별 추가 결과입니다.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ReservationRecipientCreateResponse.yaml
          example:
            common:
              authCode: A000
              authResult: Success
              infobankTrId: Infobank-Tracking-Id
            data:
              code: A000
              result: Success
              data:
                destinations:
                  - to: "01000000000"
                    msgKey: MSG_KEY_EXAMPLE
                    code: A000
                    result: Success
    "429":
      $ref: ../components/responses/RateLimited.yaml
    default:
      $ref: ../components/responses/ErrorResponse.yaml
get:
  operationId: listReservationRecipients
  tags: [Reservation]
  summary: 예약 수신자 목록 조회
  description: 예약 건에 등록된 수신자 목록을 조회합니다.
  x-source: https://developers.bizgo.io/api-sdk/api-reference/comm/reservation
  x-sdk-resource: reservations.recipients
  x-sdk-method: list
  x-sdk-retry: safe
  x-sdk-pagination:
    style: cursor
    request: lastSeq
    response: data.data.lastSeq
    hasNext: data.data.hasNext
    items: data.data.destinations
  parameters:
    - name: lastSeq
      in: query
      required: false
      description: 다음 페이지를 조회할 때 쓰는 마지막 순번입니다. 이전 응답의 `data.data.lastSeq`를 넣습니다.
      schema:
        type: integer
        format: int64
    - name: limit
      in: query
      required: false
      description: 조회 건수입니다.
      schema:
        type: integer
        minimum: 1
      x-unverified: "limit의 기본값과 최대값이 문서에 없습니다."
  responses:
    "200":
      description: 예약 수신자 목록입니다.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ReservationRecipientListResponse.yaml
    "429":
      $ref: ../components/responses/RateLimited.yaml
    default:
      $ref: ../components/responses/ErrorResponse.yaml
