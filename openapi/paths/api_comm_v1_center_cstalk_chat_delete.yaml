post:
  operationId: deleteCounselMessage
  tags: [Counsel]
  summary: 상담 메시지 삭제
  description: |
    이미 발송된 상담톡 메시지를 삭제합니다. 삭제한 메시지는 복구할 수 없습니다.
    응답 코드: `A000` 삭제 성공, `A502` 발신프로필 미등록·`senderKey`/`msgKey` 오류·소유자 불일치, `A507` `userKey` 오류, `A822` 삭제 불가 상태, `A213` 그 외 처리 실패.

    상담톡 요청·응답에는 최종 사용자 식별자(`userKey`)와 상담 내용이 들어가므로 개인정보로 취급하고 본문을 로그에 남기지 않습니다.
  x-source: https://developers.bizgo.io/api-sdk/api-reference/comm/kakao-counsel
  x-sdk-resource: counsel.messages
  x-sdk-method: delete
  x-sdk-retry: rate_limit_only
  x-unverified: "한국어 페이지(Part A)에만 있고 Copy Markdown(Part B)에는 없는 엔드포인트입니다."
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/CounselMessageDeleteRequest.yaml
        examples:
          delete:
            summary: 메시지 삭제
            value:
              cstalk:
                senderKey: SENDER_KEY_EXAMPLE
                userKey: USER_KEY_EXAMPLE
                msgKey: 20260424104234546POM101182450000
  responses:
    "200":
      description: 처리 결과입니다.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ApiResponse.yaml
          example:
            common:
              authCode: A000
              authResult: Success
              infobankTrId: Infobank-Tracking-Id
            data:
              code: A000
              result: Success
    "429":
      $ref: ../components/responses/RateLimited.yaml
    default:
      $ref: ../components/responses/ErrorResponse.yaml
