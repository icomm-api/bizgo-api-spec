delete:
  operationId: deleteCounselSystemMessage
  tags: [Counsel]
  summary: 시스템 메시지 삭제
  description: |
    시스템 메시지를 삭제합니다.

    상담톡 요청·응답에는 최종 사용자 식별자(`userKey`)와 상담 내용이 들어가므로 개인정보로 취급하고 본문을 로그에 남기지 않습니다.
  x-source: https://developers.bizgo.io/api-sdk/api-reference/comm/kakao-counsel
  x-sdk-resource: counsel.systemMessages
  x-sdk-method: delete
  x-sdk-retry: safe
  parameters:
    - name: senderKey
      in: path
      required: true
      description: 발신프로필 키입니다. URL 인코딩해서 넣습니다.
      x-unverified: "문서 요청 예시가 발신프로필 키 대신 채널 @아이디 형태(`%40...`)를 씁니다. 어느 값을 넣어야 하는지 확인이 필요합니다."
      schema:
        type: string
      example: SENDER_KEY_EXAMPLE
    - name: id
      in: path
      required: true
      description: 삭제할 시스템 메시지 ID입니다.
      schema:
        type: string
  responses:
    "200":
      description: 처리 결과입니다.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ApiResponse.yaml
          example:
            common:
              authCode: A000
              authResult: Success
              infobankTrId: Infobank-Tracking-Id
            data:
              code: A000
              result: Success
    "429":
      $ref: ../components/responses/RateLimited.yaml
    default:
      $ref: ../components/responses/ErrorResponse.yaml
