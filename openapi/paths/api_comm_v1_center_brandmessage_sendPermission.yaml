get:
  operationId: checkBrandMessageSendPermission
  summary: "브랜드메시지 발송권한 신청 가능 여부 확인"
  description: "발신프로필이 고객사 회원 대상 발송 권한을 신청할 수 있는 상태인지 확인합니다. `data.code`가 `A000`이면 신청 가능합니다. 고객사 회원 대상 발송(targeting M·N·O)에는 카카오 발송 권한이 필요합니다. 조건: 비즈니스 인증 채널, 등록된 채널 전화번호, 채널 친구 수 5만 이상, 업로드된 광고성 정보 수신동의 증적파일, 3개월 이내 알림톡 발송 이력. 어떤 조건이 미달인지는 응답으로 구분되지 않습니다."
  tags: [BrandMessage]
  x-source: "https://developers.bizgo.io/api-sdk/api-reference/comm/kakao-brand"
  x-sdk-resource: brandMessage.permissions
  x-sdk-method: check
  x-sdk-retry: safe
  parameters:
    - name: senderKey
      in: query
      required: true
      description: "발신프로필 키입니다. 최대 40자입니다."
      schema:
        type: string
        maxLength: 40
      example: SENDER_KEY_EXAMPLE
  responses:
    "200":
      description: "신청 가능 여부 확인 결과입니다."
      content:
        "application/json":
          schema:
            $ref: "../components/schemas/ApiResponse.yaml"
    "429":
      $ref: "../components/responses/RateLimited.yaml"
    default:
      $ref: "../components/responses/ErrorResponse.yaml"
post:
  operationId: applyBrandMessageSendPermission
  summary: "브랜드메시지 발송권한 신청"
  description: "고객사 회원 대상 발송(targeting M·N·O) 권한을 신청합니다. 권한은 톡채널 단위로 부여되므로 같은 톡채널을 쓰는 다른 딜러사의 발신프로필에도 함께 적용됩니다. 고객사 회원 대상 발송(targeting M·N·O)에는 카카오 발송 권한이 필요합니다. 조건: 비즈니스 인증 채널, 등록된 채널 전화번호, 채널 친구 수 5만 이상, 업로드된 광고성 정보 수신동의 증적파일, 3개월 이내 알림톡 발송 이력. 어떤 조건이 미달인지는 응답으로 구분되지 않습니다."
  tags: [BrandMessage]
  x-source: "https://developers.bizgo.io/api-sdk/api-reference/comm/kakao-brand"
  x-sdk-resource: brandMessage.permissions
  x-sdk-method: apply
  x-sdk-retry: rate_limit_only
  requestBody:
    required: true
    content:
      "application/json":
        schema:
          $ref: "../components/schemas/BrandMessagePermissionApplyRequest.yaml"
  responses:
    "200":
      description: "신청 결과입니다."
      content:
        "application/json":
          schema:
            $ref: "../components/schemas/ApiResponse.yaml"
    "429":
      $ref: "../components/responses/RateLimited.yaml"
    default:
      $ref: "../components/responses/ErrorResponse.yaml"
