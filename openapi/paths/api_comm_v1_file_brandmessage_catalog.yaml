post:
  operationId: uploadBrandMessageCatalogImage
  summary: "브랜드메시지 카탈로그 이미지 업로드"
  description: "카탈로그형(FG) 브랜드메시지에서 쓰는 1:1 비율 이미지를 업로드하고 템플릿에 쓸 `imgUrl`을 발급받습니다. 홀수형(아이템 3·5·7개)의 첫 번째 아이템은 카탈로그 홀수형 첫번째 이미지 업로드를 씁니다."
  tags: [File]
  x-source: "https://developers.bizgo.io/api-sdk/api-reference/comm/kakao-brand"
  x-sdk-resource: files
  x-sdk-method: uploadBrandMessageCatalog
  x-sdk-retry: rate_limit_only
  requestBody:
    required: true
    content:
      "multipart/form-data":
        schema:
          $ref: "../components/schemas/BrandMessageCatalogFileUploadRequest.yaml"
  responses:
    "200":
      description: "업로드 결과입니다. 성공 시 `data.data.imgUrl`에 이미지 URL이 담깁니다."
      content:
        "application/json":
          schema:
            $ref: "../components/schemas/BrandMessageFileUploadResponse.yaml"
    "429":
      $ref: "../components/responses/RateLimited.yaml"
    default:
      $ref: "../components/responses/ErrorResponse.yaml"
