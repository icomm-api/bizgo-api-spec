get:
  operationId: listAlimtalkTemplateCategories
  tags: [Alimtalk]
  summary: 알림톡 템플릿 카테고리 조회
  description: |
    알림톡 템플릿 카테고리를 조회합니다. 문서는 같은 경로에 두 기능을 둡니다.
    - `categoryCode` 없이 호출: 템플릿 카테고리 전체 목록(`data.data.categories`)
    - `categoryCode`를 넣어 호출: 해당 카테고리 상세(`data.data.category`)
  x-source: https://developers.bizgo.io/api-sdk/api-reference/comm/kakao-alimtalk
  x-unverified: "전체 조회와 상세 조회가 같은 GET 경로로 문서화되어 있어 한 operation으로 합쳤습니다. 상세 조회 응답의 `category`는 표에서 Object Array, 예시에서 Object로 서로 다릅니다."
  x-sdk-resource: alimtalk.templateCategories
  x-sdk-method: list
  x-sdk-retry: safe
  x-sdk-result: data.data
  parameters:
    - name: categoryCode
      in: query
      required: false
      description: 조회할 템플릿 카테고리 코드입니다. 넣으면 상세 조회, 생략하면 전체 조회입니다(상세 조회 문서에서는 필수).
      schema:
        type: string
  responses:
    "200":
      description: 템플릿 카테고리 목록 또는 상세입니다.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/AlimtalkTemplateCategoryResponse.yaml
          examples:
            all:
              summary: 전체 조회
              value:
                common:
                  authCode: A000
                  authResult: Success
                  infobankTrId: Infobank-Tracking-Id
                data:
                  code: A000
                  result: Success
                  data:
                    categories:
                      - code: "001001"
                        name: 주문/예약
                        groupName: 커머스
                        inclusion: 주문, 예약, 결제 알림
                        exclusion: 광고성 안내
            detail:
              summary: 상세 조회(categoryCode 지정)
              value:
                common:
                  authCode: A000
                  authResult: Success
                  infobankTrId: Infobank-Tracking-Id
                data:
                  code: A000
                  result: Success
                  data:
                    category:
                      code: "001001"
                      name: 주문/예약
                      groupName: 커머스
                      inclusion: 주문, 예약, 결제 알림
                      exclusion: 광고성 안내
    "429":
      $ref: ../components/responses/RateLimited.yaml
    default:
      $ref: ../components/responses/ErrorResponse.yaml
