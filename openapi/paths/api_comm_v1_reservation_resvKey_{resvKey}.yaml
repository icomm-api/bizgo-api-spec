parameters:
  - $ref: ../components/parameters/ResvKeyPath.yaml
get:
  operationId: getReservation
  tags: [Reservation]
  summary: 예약 상세 조회
  description: 예약 발송 키(resvKey)로 예약 건을 단건 조회합니다.
  x-source: https://developers.bizgo.io/api-sdk/api-reference/comm/reservation
  x-sdk-resource: reservations
  x-sdk-method: get
  x-sdk-retry: safe
  responses:
    "200":
      description: 예약 건입니다.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ReservationResponse.yaml
    "429":
      $ref: ../components/responses/RateLimited.yaml
    default:
      $ref: ../components/responses/ErrorResponse.yaml
put:
  operationId: updateReservation
  tags: [Reservation]
  summary: 예약 수정
  description: |
    예약 대기(PENDING) 상태인 예약 건의 발송 시각과 예약명을 수정합니다. 다른 상태이면 거절됩니다(A824).
    수정 응답에는 `resvData`가 빠질 수 있습니다.
  x-source: https://developers.bizgo.io/api-sdk/api-reference/comm/reservation
  x-sdk-resource: reservations
  x-sdk-method: update
  x-sdk-retry: safe
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/ReservationUpdateRequest.yaml
        example:
          resvSendTime: "2026-05-01 11:00:00"
          resvName: 금요일 캠페인 수정
  responses:
    "200":
      description: 수정된 예약 건입니다.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ReservationResponse.yaml
    "429":
      $ref: ../components/responses/RateLimited.yaml
    default:
      $ref: ../components/responses/ErrorResponse.yaml
