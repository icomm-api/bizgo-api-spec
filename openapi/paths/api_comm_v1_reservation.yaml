post:
  operationId: createReservation
  tags: [Reservation]
  summary: 예약 발송 등록
  description: |
    메시지를 지정한 시각에 발송하도록 예약 등록합니다. SMS/LMS/MMS, 국제, 통합 RCS, 알림톡, 브랜드메시지(기본형·자유형)를 예약할 수 있으며,
    채널별 메시지 필드는 통합 발송 규격과 같습니다. 채널별 안내는 문자·국제·RCS·알림톡·브랜드메시지 API 레퍼런스의 "예약 발송" 섹션에 있습니다.

    - `resvSendTime`은 현재 시각 + 10분부터 1년 이내여야 합니다(A316, A331).
    - 광고성 메시지는 20:00~08:00(KST)에 예약할 수 없습니다(A330).
    - 응답의 `data.resvKey`로 예약 조회·수정·취소·중지·재개·수신자 관리를 합니다.

    문서에 멱등성 키가 없으므로, 네트워크 오류로 결과를 모를 때는 다시 등록하기 전에 예약 목록 조회로 등록 여부를 확인합니다.
  x-source: https://developers.bizgo.io/api-sdk/api-reference/comm/mt
  x-sdk-resource: reservations
  x-sdk-method: create
  x-sdk-retry: rate_limit_only
  x-sdk-rate: send
  x-sdk-result: data
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/ReservationCreateRequest.yaml
        examples:
          sms:
            summary: SMS 예약 (실패 시 MMS)
            description: 지정한 시각에 SMS를 보내고, 실패하면 MMS로 대체발송합니다.
            value:
              destinations:
                - to: "01000000000"
              messageFlow:
                - sms:
                    from: "01000000000"
                    text: 예약 SMS 발송 테스트입니다.
                - mms:
                    from: "01000000000"
                    title: 예약 MMS 안내
                    text: 예약 MMS 발송 테스트입니다.
                    fileKey: [FILE_KEY_001]
              resvSendTime: "2026-05-01 10:00:00"
              resvName: 문자 예약 발송
              ref: mt-resv-20260501-001
          international:
            summary: 국제메시지 예약
            description: 수신번호는 국가번호를 포함한 E.164 형식(+ 제외)입니다.
            value:
              destinations:
                - to: "821000000000"
              messageFlow:
                - international:
                    from: "01000000000"
                    text: Your verification code is 000000.
                    clientSubId: sender-id-01
              resvSendTime: "2026-05-01 10:00:00"
              resvName: 국제메시지 예약 발송
              ref: international-resv-20260501-001
          rcs:
            summary: RCS 예약 (통합 RCS)
            description: 통합 RCS만 예약 발송이 안내되어 있습니다.
            value:
              destinations:
                - to: "01000000000"
              messageFlow:
                - rcs:
                    from: "01000000000"
                    formatId: RCS_FORMAT_ID
                    brandKey: RCS_BRAND_KEY
                    body:
                      title: 통합 RCS 예약 안내
                      description: 지정한 시각에 발송되는 통합 RCS 메시지입니다.
                    expiryOption: "1"
              resvSendTime: "2026-05-01 10:00:00"
              resvName: 통합 RCS 예약 발송
              ref: rcs-resv-20260501-001
          alimtalk:
            summary: 알림톡 예약 (전문 발송)
            description: 알림톡 전문 발송 형식에 예약 시각을 더합니다.
            value:
              destinations:
                - to: "01000000000"
                  replaceWords:
                    name: 홍길동
              messageFlow:
                - alimtalk:
                    msgType: AT
                    senderKey: SENDER_KEY_EXAMPLE
                    templateCode: TEMPLATE_CODE_EXAMPLE
                    text: "#{name}님의 예약이 접수되었습니다."
              resvSendTime: "2026-05-01 10:00:00"
              resvName: 알림톡 예약 발송
              ref: alimtalk-resv-20260501-001
          brandmessage_basic:
            summary: 브랜드메시지 예약 (기본형)
            description: 광고성 메시지는 20:00~08:00(KST)에 예약할 수 없습니다(A330).
            value:
              destinations:
                - to: "01000000000"
              messageFlow:
                - brandmessage:
                    sendType: basic
                    msgType: FT
                    senderKey: SENDER_KEY_EXAMPLE
                    templateCode: TEMPLATE_CODE_EXAMPLE
                    targeting: M
              resvSendTime: "2026-05-01 10:00:00"
              resvName: 브랜드메시지 기본형 예약 발송
              ref: brand-basic-resv-20260501-001
          brandmessage_free:
            summary: 브랜드메시지 예약 (자유형 텍스트)
            description: 템플릿 없이 본문을 직접 구성하는 자유형 예약입니다.
            value:
              destinations:
                - to: "01000000000"
              messageFlow:
                - brandmessage:
                    sendType: free
                    msgType: FT
                    senderKey: SENDER_KEY_EXAMPLE
                    text: 자유형 브랜드메시지 예약 발송 본문입니다.
                    targeting: M
              resvSendTime: "2026-05-01 10:00:00"
              resvName: 브랜드메시지 자유형 예약 발송
              ref: brand-free-resv-20260501-001
  responses:
    "200":
      description: 예약 등록 결과입니다. 수신자별 `code`도 함께 확인합니다.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ReservationCreateResponse.yaml
          example:
            common:
              authCode: A000
              authResult: Success
              infobankTrId: Infobank-Tracking-Id
            data:
              code: A000
              result: Success
              resvKey: RESV_KEY_EXAMPLE
              data:
                destinations:
                  - to: "01000000000"
                    msgKey: MSG_KEY_EXAMPLE
                    code: A000
                    result: Success
              ref: mt-resv-20260501-001
    "429":
      $ref: ../components/responses/RateLimited.yaml
    default:
      $ref: ../components/responses/ErrorResponse.yaml
