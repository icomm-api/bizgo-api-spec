post:
  operationId: sendCounselRich
  tags: [Counsel]
  summary: 상담톡 Rich 메시지 발송
  description: |
    상담톡 Rich 메시지(TEXT, IMAGE, WIDE, ITEM_LIST, WIDE_ITEM_LIST, CAROUSEL_FEED, PERSONAL)를 발송합니다.
    `KAKAO_CERT`(본인인증) 발송은 채널이 본인인증 화이트리스트에 사전 등록되어 있어야 하며, 결과는 `counselCertResult` 웹훅으로 옵니다.

    상담 세션이 열려 있는 사용자에게만 보낼 수 있습니다. 세션은 사용자의 마지막 메시지 수신 후 30일간 유지됩니다.
    접수 결과의 `msgKey`로 발송 결과 웹훅(`counselResult`)과 대조합니다. 두 번 호출하면 중복 발송되므로 429 외에는 자동 재시도하지 않습니다.

    상담톡 요청·응답에는 최종 사용자 식별자(`userKey`)와 상담 내용이 들어가므로 개인정보로 취급하고 본문을 로그에 남기지 않습니다.
  x-source: https://developers.bizgo.io/api-sdk/api-reference/comm/kakao-counsel
  x-sdk-resource: counsel.messages
  x-sdk-method: sendRich
  x-sdk-retry: rate_limit_only
  x-sdk-rate: send
  x-sdk-result: data
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/CounselRichMessageRequest.yaml
        examples:
          textWithButton:
            summary: 버튼이 있는 텍스트 메시지
            value:
              userKey: USER_KEY_EXAMPLE
              senderKey: SENDER_KEY_EXAMPLE
              msgType: TEXT
              message: 상담 안내 메시지입니다.
              attachment:
                buttons:
                  - type: WL
                    name: 바로가기
                    urlMobile: https://m.example.com
                    urlPc: https://www.example.com
              ref: client-ref-001
  responses:
    "200":
      description: 접수 결과입니다. `msgKey`는 `data` 바로 아래에 옵니다.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/CounselSendResponse.yaml
          example:
            common:
              authCode: A000
              authResult: Success
              infobankTrId: Infobank-Tracking-Id
            data:
              code: A000
              result: Success
              msgKey: 20260424104234546POM101182450000
              ref: client-ref-001
    "429":
      $ref: ../components/responses/RateLimited.yaml
    default:
      $ref: ../components/responses/ErrorResponse.yaml
