get:
  operationId: listBrandMessageTemplates
  summary: "브랜드메시지 템플릿 목록 조회"
  description: "발신프로필(또는 그룹키)에 등록된 브랜드메시지 템플릿 목록을 페이징 조회합니다. 카카오를 호출하지 않고 비즈고에 적재된 템플릿을 읽으므로 목록 화면이나 주기적인 동기화에 쓸 수 있습니다."
  tags: [BrandMessage]
  x-source: "https://developers.bizgo.io/api-sdk/api-reference/comm/kakao-brand"
  x-sdk-resource: brandMessage.templates
  x-sdk-method: list
  x-sdk-retry: safe
  x-sdk-pagination:
    style: offset
    request: offset
    size: limit
    items: data.data.brandmessage.templates
  x-unverified: "이 엔드포인트는 한국어 페이지(Part A)에만 있습니다. `senderKeyType`·`status`·`templateType` 값 목록과 `offset`·`limit` 기본값·최대값, 전체 건수 필드가 문서에 없습니다."
  parameters:
    - name: senderKey
      in: query
      required: true
      description: "발신프로필 키 또는 그룹키입니다."
      schema:
        type: string
      example: SENDER_KEY_EXAMPLE
    - name: senderKeyType
      in: query
      required: false
      description: "발신키 유형입니다. 문서 예시 값은 `S`(발신프로필)입니다. 기본값은 `S`입니다."
      schema:
        type: string
      example: S
    - name: status
      in: query
      required: false
      description: "템플릿 상태입니다. 알려진 값: `A`(등록), `S`(차단)."
      schema:
        type: string
        x-known-values: [A, S]
    - name: templateType
      in: query
      required: false
      description: "템플릿 유형입니다."
      schema:
        type: string
    - name: offset
      in: query
      required: false
      description: "조회 시작 위치입니다."
      schema:
        type: integer
        minimum: 0
      example: 0
    - name: limit
      in: query
      required: false
      description: "조회 건수입니다."
      schema:
        type: integer
        minimum: 1
      example: 100
  responses:
    "200":
      description: "템플릿 목록입니다."
      content:
        "application/json":
          schema:
            $ref: "../components/schemas/BrandMessageTemplateListResponse.yaml"
    "429":
      $ref: "../components/responses/RateLimited.yaml"
    default:
      $ref: "../components/responses/ErrorResponse.yaml"
