get:
  operationId: listKakaoSenderProfiles
  tags: [Kakao]
  summary: 발신프로필 목록 조회
  description: API 키에 등록된 발신프로필 목록을 조회합니다. 검색 기간과 발신프로필 키로 범위를 좁힐 수 있고, 결과는 페이지 단위로 반환합니다.
  x-source: https://developers.bizgo.io/api-sdk/api-reference/comm/kakao-common
  x-unverified: "이 엔드포인트는 한국어 페이지(Part A)에만 있고 Copy Markdown(Part B)에는 없습니다. 날짜 형식과 page·rows 기본값·최대값이 문서에 없습니다."
  x-sdk-resource: kakao.senders
  x-sdk-method: list
  x-sdk-retry: safe
  x-sdk-result: data
  x-sdk-pagination:
    style: page
    request: page
    size: rows
    items: data.channels
    total: data.totalCount
    hasNext: data.hasNext
  parameters:
    - name: startDate
      in: query
      required: false
      description: 검색 시작일입니다.
      schema:
        type: string
      x-unverified: "날짜 형식이 문서에 없습니다."
    - name: endDate
      in: query
      required: false
      description: 검색 종료일입니다.
      schema:
        type: string
      x-unverified: "날짜 형식이 문서에 없습니다."
    - name: senderKey
      in: query
      required: false
      description: 발신프로필 키 또는 발신프로필 그룹키입니다.
      schema:
        type: string
    - name: page
      in: query
      required: false
      description: 페이지 번호입니다.
      schema:
        type: integer
    - name: rows
      in: query
      required: false
      description: 페이지당 조회 건수입니다.
      schema:
        type: integer
  responses:
    "200":
      description: 발신프로필 목록입니다.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/KakaoSenderListResponse.yaml
          example:
            common:
              authCode: A000
              authResult: SUCCESS
              infobankTrId: Infobank-Tracking-Id
            data:
              code: A000
              result: SUCCESS
              resultMsg: 요청 성공
              page: 1
              totalPage: 1
              totalCount: 1
              hasNext: false
              channels:
                - senderKey: SENDER_KEY_EXAMPLE
                  senderKeyType: S
                  channelName: 비즈고
                  channelId: "@KAKAO_CHANNEL_ID_EXAMPLE"
                  channelKey: base
                  categoryCode: "00000000001"
                  status: A
                  profileStatus: A
                  dormant: false
                  block: false
                  businessProfile: true
                  businessType: BUSINESS
                  createdAt: "2026-07-24 10:51:47"
                  regDate: "2026-07-24 10:51:47"
                  updateDate: "2026-07-24 10:52:03"
    "429":
      $ref: ../components/responses/RateLimited.yaml
    default:
      $ref: ../components/responses/ErrorResponse.yaml
