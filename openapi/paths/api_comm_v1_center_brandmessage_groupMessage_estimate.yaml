get:
  operationId: estimateBrandMessageGroupSendDuration
  summary: "동보 발송 예상 소요시간 조회"
  description: "동보 발송 시작 시각과 대상 수로 예상 종료 시각과 소요 시간을 조회합니다."
  tags: [BrandMessage]
  x-source: "https://developers.bizgo.io/api-sdk/api-reference/comm/kakao-brand"
  x-sdk-resource: brandMessage.audience
  x-sdk-method: estimate
  x-sdk-retry: safe
  parameters:
    - name: senderKey
      in: query
      required: true
      description: "발신프로필 키입니다."
      schema:
        type: string
      example: SENDER_KEY_EXAMPLE
    - name: startTime
      in: query
      required: true
      description: "동보 발송 시작 일시(`yyyy-MM-dd'T'HH:mm:ss`, KST)입니다. 동보 발송 요청의 `sendStartAt`(`yyyy-MM-dd HH:mm:ss`)과 형식이 다릅니다."
      schema:
        type: string
        x-format: "yyyy-MM-dd'T'HH:mm:ss"
      example: "2026-04-08T16:40:00"
    - name: count
      in: query
      required: true
      description: "발송 모수입니다."
      schema:
        type: integer
      example: 320
    - name: target
      in: query
      required: false
      description: "대상 유형입니다. 기본값은 `NONE`입니다."
      schema:
        type: string
        enum: [NONE, FRIEND_GROUP]
        default: NONE
      example: FRIEND_GROUP
  responses:
    "200":
      description: "예상 종료 시각과 소요 시간입니다."
      content:
        "application/json":
          schema:
            $ref: "../components/schemas/BrandMessageAudienceEstimateResponse.yaml"
    "429":
      $ref: "../components/responses/RateLimited.yaml"
    default:
      $ref: "../components/responses/ErrorResponse.yaml"
