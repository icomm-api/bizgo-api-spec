post:
  operationId: createKakaoSender
  tags: [Kakao]
  summary: 인증 토큰으로 발신프로필 등록
  description: |
    카카오톡 채널을 발신프로필로 신규 등록합니다.
    카카오비즈니스 파트너센터에서 비즈니스 인증을 받았고, 프로필이 activated 상태이며 운영자에 의해 차단되지 않은 채널이어야 합니다.
    카카오 채널 인증 토큰 요청(`POST /api/comm/v1/account/kakao/sender/token`)으로 받은 토큰과 그때 쓴 전화번호를 헤더로 보냅니다.

    다른 허브파트너 요청으로 이미 등록된 채널이면 이전에 등록된 발신프로필의 카테고리 코드로 등록됩니다.
    브랜드메시지를 쓰는 발신프로필은 무료수신거부 전화번호·인증번호를 설정할 수 있습니다(타겟팅 M, N, O 사용 시 필수).
  x-source: https://developers.bizgo.io/api-sdk/api-reference/comm/kakao-common
  x-sdk-resource: kakao.senders
  x-sdk-method: create
  x-sdk-retry: rate_limit_only
  x-sdk-result: data.kakao.senderProfile
  parameters:
    - name: token
      in: header
      required: true
      description: 카카오 채널 인증 토큰 요청 후 카카오톡으로 받은 채널 인증 토큰 값입니다.
      schema:
        type: string
      example: KAKAO_AUTH_TOKEN_EXAMPLE
    - name: phoneNumber
      in: header
      required: true
      description: 관리자 전화번호입니다. 카카오 채널 인증 토큰 요청 시 입력한 번호와 같아야 합니다.
      schema:
        type: string
      example: "01000000000"
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/KakaoSenderCreateRequest.yaml
        example:
          yellowId: "@KAKAO_CHANNEL_ID_EXAMPLE"
          categoryCode: "00000000001"
  responses:
    "200":
      description: 등록 결과입니다. 성공 시 `data.kakao.senderProfile.senderKey`에 발신프로필 키가 담깁니다.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/KakaoSenderAccountResponse.yaml
          example:
            common:
              authCode: A000
              authResult: SUCCESS
              infobankTrId: Infobank-Tracking-Id
            data:
              code: A000
              result: SUCCESS
              resultMsg: 요청 성공
              kakao:
                senderProfile:
                  senderKey: SENDER_KEY_EXAMPLE
                  uuid: "@KAKAO_CHANNEL_ID_EXAMPLE"
                  name: 비즈고
                  status: A
                  block: false
                  dormant: false
                  profileStatus: A
                  createdAt: "2026-07-24 13:32:17"
                  modifiedAt: "2026-07-24 13:32:18"
                  categoryCode: "00000000001"
                  brandtalk: false
                  brandMessage: false
                  channelKey: base
                  businessProfile: true
                  businessType: BUSINESS
                  profileSpamLevel: 정상
                  profileMessageSpamLevel: 정상
    "429":
      $ref: ../components/responses/RateLimited.yaml
    default:
      $ref: ../components/responses/ErrorResponse.yaml
get:
  operationId: findKakaoSender
  tags: [Kakao]
  summary: 발신프로필 키 또는 uuid로 조회
  description: 발신프로필 키(`senderKey`) 또는 카카오톡 채널 uuid에 해당하는 발신프로필을 조회합니다. `senderKey`와 `uuid` 중 하나는 반드시 입력해야 합니다.
  x-source: https://developers.bizgo.io/api-sdk/api-reference/comm/kakao-common
  x-sdk-resource: kakao.senders
  x-sdk-method: find
  x-sdk-retry: safe
  x-sdk-result: data.kakao.senderProfile
  parameters:
    - name: uuid
      in: query
      required: false
      description: 조회할 카카오톡 채널의 uuid(`@`로 시작하는 채널 아이디)입니다. `senderKey`가 없으면 필수입니다.
      schema:
        type: string
      example: "@KAKAO_CHANNEL_ID_EXAMPLE"
    - name: senderKey
      in: query
      required: false
      description: 조회할 발신프로필 키입니다. `uuid`가 없으면 필수입니다.
      schema:
        type: string
      example: SENDER_KEY_EXAMPLE
  responses:
    "200":
      description: 발신프로필 정보입니다.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/KakaoSenderAccountResponse.yaml
    "429":
      $ref: ../components/responses/RateLimited.yaml
    default:
      $ref: ../components/responses/ErrorResponse.yaml
