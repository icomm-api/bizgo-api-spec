get:
  operationId: listRcsTemplateForms
  tags: [RCS]
  summary: RCS 템플릿 양식 목록 조회
  description: |
    RCS 템플릿 등록에 사용할 수 있는 템플릿 양식 목록을 조회합니다.
  x-source: https://developers.bizgo.io/api-sdk/api-reference/comm/rcs
  x-sdk-resource: rcs.templateForms
  x-sdk-method: list
  x-sdk-retry: safe
  x-sdk-pagination:
    style: offset
    request: offset
    size: limit
    items: data.data.rcs.messageForms
    total: data.data.rcs.pagination.total
  parameters:
    - name: offset
      in: query
      required: false
      description: 조회 시작 위치입니다. 기본값 0(영문 문서 기준).
      schema:
        type: integer
        default: 0
    - name: limit
      in: query
      required: false
      description: 조회 최대 건수입니다. 최소 100, 최대 1000, 기본값 100(영문 문서 기준).
      schema:
        type: integer
        minimum: 100
        maximum: 1000
        default: 100
  responses:
    "200":
      description: 처리 결과입니다. 성공 여부는 `common.authCode`와 `data.code`로 확인합니다.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/RcsMessagebaseFormListResponse.yaml
          example:
            common:
              authCode: "A000"
              authResult: "Success"
              infobankTrId: "Infobank-Tracking-Id"
            data:
              code: "A000"
              result: "Success"
              data:
                rcs:
                  messageForms:
                    - messagebaseformId: "MESSAGEBASEFORM_ID_EXAMPLE"
                      formName: "모바일 상품권 전송 T"
                      cardType: "standalone media top"
    "429":
      $ref: ../components/responses/RateLimited.yaml
    default:
      $ref: ../components/responses/ErrorResponse.yaml
