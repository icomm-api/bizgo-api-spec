post:
  operationId: uploadCounselFile
  tags: [Counsel]
  summary: 상담톡 파일 업로드
  description: |
    상담톡 FILE·AUDIO·VIDEO 타입 첨부 파일을 올리고 `fileUrl`을 받습니다. 운영은 최대 300MB, 샌드박스는 최대 10MB입니다.

    상담톡 요청·응답에는 최종 사용자 식별자(`userKey`)와 상담 내용이 들어가므로 개인정보로 취급하고 본문을 로그에 남기지 않습니다.
  x-source: https://developers.bizgo.io/api-sdk/api-reference/comm/kakao-counsel
  x-sdk-resource: counsel.files
  x-sdk-method: upload
  x-sdk-retry: rate_limit_only
  requestBody:
    required: true
    content:
      multipart/form-data:
        schema:
          $ref: ../components/schemas/CounselFileUploadRequest.yaml
  responses:
    "200":
      description: 업로드 결과입니다.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/CounselFileUploadResponse.yaml
          example:
            common:
              authCode: A000
              authResult: Success
              infobankTrId: Infobank-Tracking-Id
            data:
              code: A000
              result: Success
              data:
                fileUrl: https://example.kakao.file/cstalk_file.pdf
                fileName: sample.pdf
                size: "102400"
    "429":
      $ref: ../components/responses/RateLimited.yaml
    default:
      $ref: ../components/responses/ErrorResponse.yaml
