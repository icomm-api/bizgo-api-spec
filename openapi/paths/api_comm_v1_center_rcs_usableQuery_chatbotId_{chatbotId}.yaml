parameters:
  - name: chatbotId
    in: path
    required: true
    description: 대화방 ID입니다.
    schema:
      type: string
    example: "CHATBOT_ID_EXAMPLE"
get:
  operationId: getRcsChatbotUsableQueries
  tags: [RCS]
  summary: RCS 대화방 사용 가능 쿼리 조회
  description: |
    대화방 ID를 기준으로 해당 대화방에서 사용할 수 있는 쿼리 정보를 조회합니다.
  x-source: https://developers.bizgo.io/api-sdk/api-reference/comm/rcs
  x-sdk-resource: rcs.chatbots
  x-sdk-method: getUsableQueries
  x-sdk-retry: safe
  x-unverified: "응답이 대화방 정보(chatbot 배열)로 문서화되어 있어 쿼리 정보 필드가 없습니다. 문서 복사 오류일 가능성이 높습니다."
  responses:
    "200":
      description: 처리 결과입니다. 성공 여부는 `common.authCode`와 `data.code`로 확인합니다.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/RcsChatbotResponse.yaml
          example:
            common:
              authCode: "A000"
              authResult: "Success"
              infobankTrId: "Infobank-Tracking-Id"
            data:
              code: "A000"
              result: "Success"
              data:
                rcs:
                  chatbot:
                    - chatbotId: "CHATBOT_ID_EXAMPLE"
                      brandId: "BRAND_ID_EXAMPLE"
                      mdn: "01000000000"
                      subTitle: "고객센터 대화방"
                      status: "ready"
                      approvalResult: "approved"
                      registerDate: "2026-07-21 10:00:00"
    "429":
      $ref: ../components/responses/RateLimited.yaml
    default:
      $ref: ../components/responses/ErrorResponse.yaml
