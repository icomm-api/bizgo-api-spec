get:
  operationId: getRcsBrand
  tags: [RCS]
  summary: RCS 브랜드 상세 조회
  description: |
    brandId 기준으로 RCS 브랜드 상세 정보를 조회합니다.
  x-source: https://developers.bizgo.io/api-sdk/api-reference/comm/rcs
  x-sdk-resource: rcs.brands
  x-sdk-method: get
  x-sdk-retry: safe
  parameters:
    - name: brandId
      in: query
      required: true
      description: 조회할 브랜드 ID입니다.
      schema:
        type: string
      example: "BRAND_ID_EXAMPLE"
  responses:
    "200":
      description: 처리 결과입니다. 성공 여부는 `common.authCode`와 `data.code`로 확인합니다.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/RcsBrandResponse.yaml
          example:
            common:
              authCode: "A000"
              authResult: "Success"
              infobankTrId: "Infobank-Tracking-Id"
            data:
              code: "A000"
              result: "Success"
              data:
                rcs:
                  brandId: "BRAND_ID_EXAMPLE"
                  name: "비즈고"
                  brandKey: "RCS_BRAND_KEY"
                  status: "ready"
    "429":
      $ref: ../components/responses/RateLimited.yaml
    default:
      $ref: ../components/responses/ErrorResponse.yaml
put:
  operationId: updateRcsBrand
  tags: [RCS]
  summary: RCS 브랜드 수정
  description: |
    브랜드 기본 정보와 브랜드 이미지를 수정합니다. `multipart/form-data`로 보내며,
    `regBrand`는 JSON 문자열 파트, 이미지·증빙 파일은 바이너리 파트입니다.
    파일 스트림을 다시 보내야 하고 검수 요청이 다시 걸릴 수 있으므로 SDK는 429만 재시도합니다.
  x-source: https://developers.bizgo.io/api-sdk/api-reference/comm/rcs
  x-sdk-resource: rcs.brands
  x-sdk-method: update
  x-sdk-retry: rate_limit_only
  requestBody:
    required: true
    content:
      multipart/form-data:
        schema:
          $ref: ../components/schemas/RcsBrandUpdateRequest.yaml
        encoding:
          regBrand:
            contentType: application/json
  responses:
    "200":
      description: 처리 결과입니다. 성공 여부는 `common.authCode`와 `data.code`로 확인합니다.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/RcsBrandResponse.yaml
          example:
            common:
              authCode: "A000"
              authResult: "Success"
              infobankTrId: "Infobank-Tracking-Id"
            data:
              code: "A000"
              result: "Success"
              data:
                rcs:
                  brandId: "BRAND_ID_EXAMPLE"
                  name: "비즈고"
                  brandKey: "RCS_BRAND_KEY"
                  status: "ready"
    "429":
      $ref: ../components/responses/RateLimited.yaml
    default:
      $ref: ../components/responses/ErrorResponse.yaml
