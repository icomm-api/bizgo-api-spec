get:
  operationId: listBrandMessageVideos
  summary: "브랜드메시지 동영상 목록 조회"
  description: "발신프로필 기준으로 업로드한 동영상 이력을 조회합니다. 등록일자로 거르고 `offset`·`limit`으로 페이징합니다."
  tags: [BrandMessage]
  x-source: "https://developers.bizgo.io/api-sdk/api-reference/comm/kakao-brand"
  x-sdk-resource: brandMessage.videos
  x-sdk-method: list
  x-sdk-retry: safe
  x-sdk-pagination:
    style: offset
    request: offset
    size: limit
    items: data.data.videos
    total: data.data.totalCount
  parameters:
    - name: senderKey
      in: query
      required: true
      description: "발신프로필 키입니다. 최대 40자입니다."
      schema:
        type: string
        maxLength: 40
      example: SENDER_KEY_EXAMPLE
    - name: date
      in: query
      required: false
      description: "조회할 등록일자(`yyyyMMdd`)입니다. 생략하면 전체를 조회합니다."
      schema:
        type: string
        x-format: yyyyMMdd
      example: "20260624"
    - name: offset
      in: query
      required: false
      description: "조회 시작 위치입니다. 음수는 쓸 수 없습니다. 기본값은 0입니다."
      schema:
        type: integer
        minimum: 0
        default: 0
    - name: limit
      in: query
      required: false
      description: "조회 건수입니다. 기본값 100, 최대 1,000입니다."
      schema:
        type: integer
        minimum: 1
        maximum: 1000
        default: 100
  responses:
    "200":
      description: "동영상 목록입니다."
      content:
        "application/json":
          schema:
            $ref: "../components/schemas/BrandMessageVideoListResponse.yaml"
    "429":
      $ref: "../components/responses/RateLimited.yaml"
    default:
      $ref: "../components/responses/ErrorResponse.yaml"
