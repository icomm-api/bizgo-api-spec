get:
  operationId: listBrandMessageFriendGroupPhoneNumberRequests
  summary: "친구 그룹 전화번호 요청 목록 조회"
  description: "친구 그룹 전화번호 추가·삭제 요청의 처리 상태를 목록으로 조회합니다. 다음 페이지는 이전 응답의 마지막 항목 `requestId`를 `lastRequestId`로 넘겨 조회합니다."
  tags: [BrandMessage]
  x-source: "https://developers.bizgo.io/api-sdk/api-reference/comm/kakao-brand"
  x-sdk-resource: brandMessage.friendGroups
  x-sdk-method: listPhoneNumberRequests
  x-sdk-retry: safe
  x-sdk-pagination:
    style: cursor
    request: lastRequestId
    response: "data.data.friendGroups[-1].requestId"
    hasNext: data.data.hasNext
    items: data.data.friendGroups
  x-unverified: "이 엔드포인트는 한국어 페이지(Part A)에만 있습니다. 응답에 다음 커서 필드가 없어 마지막 항목의 `requestId`를 `lastRequestId`로 쓰는 것으로 해석했습니다. `count` 기본값·최대값이 없습니다."
  parameters:
    - name: senderKey
      in: query
      required: true
      description: "발신프로필 키입니다."
      schema:
        type: string
      example: SENDER_KEY_EXAMPLE
    - name: friendGroupKey
      in: query
      required: true
      description: "친구 그룹 키입니다."
      schema:
        type: string
      example: FRIEND_GROUP_KEY_EXAMPLE
    - name: lastRequestId
      in: query
      required: false
      description: "이전 페이지의 마지막 요청 아이디입니다."
      schema:
        type: string
    - name: count
      in: query
      required: false
      description: "조회 건수입니다."
      schema:
        type: integer
        minimum: 1
      example: 10
  responses:
    "200":
      description: "전화번호 요청 목록입니다."
      content:
        "application/json":
          schema:
            $ref: "../components/schemas/BrandMessageFriendGroupPhoneNumberRequestListResponse.yaml"
    "429":
      $ref: "../components/responses/RateLimited.yaml"
    default:
      $ref: "../components/responses/ErrorResponse.yaml"
