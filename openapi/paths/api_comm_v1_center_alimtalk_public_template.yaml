get:
  operationId: listAlimtalkPublicTemplates
  tags: [Alimtalk]
  summary: 알림톡 공용템플릿 조회
  description: |
    카카오가 제공하는 공용템플릿 목록을 조회합니다.

    **신규 발송에 권장하지 않습니다.** 공용템플릿은 비즈고 콘솔 템플릿 선택 화면에서 제외되었고 조회 API만 남아 있으며, 이후 제공이 중단될 예정입니다.
    발송 시 변수 치환 결과가 템플릿에 정의된 글자 수를 넘으면 잘라내거나 대체발송하지 않고 실패로 처리합니다.
    신규 연동은 템플릿 등록으로 직접 만든 템플릿을 사용합니다.
  deprecated: true
  x-source: https://developers.bizgo.io/api-sdk/api-reference/comm/kakao-alimtalk
  x-unverified: "마지막 페이지 판별 방법(hasNext·total)이 응답에 없습니다."
  x-sdk-resource: alimtalk.publicTemplates
  x-sdk-method: list
  x-sdk-retry: safe
  x-sdk-result: data.data.templates
  x-sdk-pagination:
    style: page
    request: page
    size: count
    items: data.data.templates
  parameters:
    - name: since
      in: query
      required: false
      description: 조회 기준 시각(yyyyMMddHHmmss)입니다. 기본값은 `20250708000000`입니다.
      schema:
        type: string
        x-format: yyyyMMddHHmmss
        default: "20250708000000"
      example: "20250708000000"
    - name: page
      in: query
      required: false
      description: 조회 페이지 번호입니다. 기본값은 1입니다.
      schema:
        type: integer
        minimum: 1
        default: 1
    - name: count
      in: query
      required: false
      description: 페이지당 조회 건수입니다. 기본값 100, 최대 1,000입니다.
      schema:
        type: integer
        minimum: 1
        maximum: 1000
        default: 100
  responses:
    "200":
      description: 공용템플릿 목록입니다.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/AlimtalkTemplatePublicListResponse.yaml
          example:
            common:
              authCode: A000
              authResult: Success
              infobankTrId: Infobank-Tracking-Id
            data:
              code: A000
              result: Success
              data:
                templates:
                  - templateName: 주문 완료 안내
                    templateCode: TEMPLATE_CODE_EXAMPLE
                    status: APR
                    categoryCode: "001001"
                    releaseDate: "2026-04-08 10:00:00"
                    previewImageUrl: https://example.kakao.image/public-template.png
    "429":
      $ref: ../components/responses/RateLimited.yaml
    default:
      $ref: ../components/responses/ErrorResponse.yaml
