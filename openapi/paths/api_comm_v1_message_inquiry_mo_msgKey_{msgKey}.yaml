get:
  operationId: getMoByMsgKey
  tags: [Message]
  summary: MO(수신) 단건 조회
  description: 메시지 키로 MO 메시지를 조회합니다. 같은 msgKey가 여러 건일 수 있어 배열로 반환합니다.
  x-source: https://developers.bizgo.io/api-sdk/api-reference/comm/insight
  x-sdk-resource: messages
  x-sdk-method: mo
  x-sdk-retry: safe
  parameters:
    - name: msgKey
      in: path
      required: true
      description: 조회할 MO 메시지 키입니다.
      schema:
        type: string
  responses:
    "200":
      description: MO 메시지 목록입니다.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/MoMessageListResponse.yaml
    "429":
      $ref: ../components/responses/RateLimited.yaml
    default:
      $ref: ../components/responses/ErrorResponse.yaml
