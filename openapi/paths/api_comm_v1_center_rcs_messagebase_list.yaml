get:
  operationId: listRcsTemplates
  tags: [RCS]
  summary: RCS 템플릿 목록 조회
  description: |
    브랜드 ID를 기준으로 등록된 RCS 템플릿 목록을 조회합니다.
  x-source: https://developers.bizgo.io/api-sdk/api-reference/comm/rcs
  x-sdk-resource: rcs.templates
  x-sdk-method: list
  x-sdk-retry: safe
  x-unverified: "설명은 브랜드 ID 기준 조회라고 하나 brandId 등 요청 파라미터가 문서화되어 있지 않습니다. 응답에 pagination이 있으나 페이지 파라미터도 없어 x-sdk-pagination을 두지 않았습니다."
  responses:
    "200":
      description: 처리 결과입니다. 성공 여부는 `common.authCode`와 `data.code`로 확인합니다.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/RcsTemplateListResponse.yaml
          example:
            common:
              authCode: "A000"
              authResult: "Success"
              infobankTrId: "Infobank-Tracking-Id"
            data:
              code: "A000"
              result: "Success"
              data:
                rcs:
                  templates:
                    - messagebaseId: "MESSAGEBASE_ID_EXAMPLE"
                      formatId: "FORMAT_ID_EXAMPLE"
                      templateName: "통합 정보형 템플릿"
                      status: "ready"
                      approvalResult: "approved"
    "429":
      $ref: ../components/responses/RateLimited.yaml
    default:
      $ref: ../components/responses/ErrorResponse.yaml
