get:
  operationId: listRcsCommonFormats
  tags: [RCS]
  summary: RCS 공통 포맷 목록 조회
  description: |
    RCS에서 사용할 수 있는 공통 포맷 목록을 조회합니다.
  x-source: https://developers.bizgo.io/api-sdk/api-reference/comm/rcs
  x-sdk-resource: rcs.commonFormats
  x-sdk-method: list
  x-sdk-retry: safe
  x-unverified: "응답에 pagination(offset/limit/total)이 있으나 요청 쪽 페이지 파라미터가 문서화되어 있지 않아 x-sdk-pagination을 두지 않았습니다."
  responses:
    "200":
      description: 처리 결과입니다. 성공 여부는 `common.authCode`와 `data.code`로 확인합니다.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/RcsMessagebaseCommonListResponse.yaml
          example:
            common:
              authCode: "A000"
              authResult: "Success"
              infobankTrId: "Infobank-Tracking-Id"
            data:
              code: "A000"
              result: "Success"
              data:
                rcs:
                  messageForms:
                    - messagebaseformId: "MESSAGEBASEFORM_ID_EXAMPLE"
                      formName: "모바일 상품권 전송 T"
                      bizCondition: []
                      cardType: "standalone media top"
                      registerDate: "2026-02-05T17:59:20"
                      updateDate: "2026-02-05T18:37:56"
    "429":
      $ref: ../components/responses/RateLimited.yaml
    default:
      $ref: ../components/responses/ErrorResponse.yaml
