post:
  operationId: onReportWebhook
  tags: [Webhook]
  summary: 리포트 수신(Webhook)
  description: |
    콘솔에 등록한 웹훅 URL로 리포트가 1건씩 전송됩니다. 5초 안에 `{"msgKey": "<받은 msgKey>"}`로 응답해야 하며,
    응답이 없거나 규격이 다르면 최대 3회 재전송됩니다. 같은 리포트가 두 번 올 수 있으므로 msgKey 기준으로 중복 처리합니다.
    요청에는 `X-IB-Timestamp`와 `X-IB-Signature`(`HmacSHA256(secret, X-IB-Timestamp)`) 헤더가 붙습니다. secret은 비즈고에 요청해 받습니다.
  x-source: https://developers.bizgo.io/api-sdk/api-reference/comm/report
  x-sdk-webhook: report
  security: []
  parameters:
    - $ref: ../components/parameters/WebhookTimestampHeader.yaml
    - $ref: ../components/parameters/WebhookSignatureHeader.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/ReportWebhookPayload.yaml
  responses:
    "200":
      description: 수신 성공 응답입니다.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/WebhookAck.yaml
