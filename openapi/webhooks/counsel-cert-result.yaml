post:
  operationId: onCounselCertResultWebhook
  tags: [Webhook]
  summary: 상담톡 본인인증 결과 수신(Webhook)
  description: |
    `KAKAO_CERT` 말풍선으로 요청한 카카오톡 본인인증(전자서명)이 완료되면 결과가 전달됩니다. 상담 세션 상태와 관계없이 전달됩니다.
    `certResult`는 AES256/CTR/NoPadding + Base64로 암호화된 인증정보(이름·전화번호·생년월일·성별·내외국인·CI)입니다.
    카카오 정책상 인증정보는 저장하지 말고 사용자를 식별한 즉시 파기해야 하며, 로그·APM·에러 리포트에 남지 않도록 마스킹합니다.
    복호화 키는 카카오가 이메일로 별도 전달하므로 코드·저장소에 넣지 말고 비밀 저장소에서 읽습니다.

    등록한 고객 Webhook URL 뒤에 `/cstalk/cert_result`를 붙인 주소로 POST됩니다. HTTP 200과 `{"code": "A000", "result": "Success"}` 형식의 응답을 받아야 정상 처리되며,
    응답이 없거나 규격이 다르면 최대 3회 재시도하고 모두 실패하면 다시 보내지 않습니다(Connect/Read Timeout 각 5초).
    재시도로 같은 이벤트가 다시 올 수 있으므로 멱등 처리하고, 수신 순서는 보장되지 않습니다. 세션 연결은 `sessionId`로 합니다.

    서명: 상담톡 웹훅에는 서명 헤더(`X-IB-Timestamp`/`X-IB-Signature`)가 없습니다. 서명은 리포트·MO 웹훅에만 적용됩니다.
    수신 엔드포인트에는 HTTPS와 발신 IP 허용 목록([방화벽 및 보안 프로토콜](https://developers.bizgo.io/api-sdk/api-reference#firewall-and-security))을 적용합니다.

    본문에는 최종 사용자 식별자와 상담 내용이 들어 있으므로 개인정보로 취급하고 로그·APM·에러 리포트에 본문을 남기지 않습니다.
  x-source: https://developers.bizgo.io/api-sdk/api-reference/comm/kakao-counsel
  x-sdk-webhook: counselCertResult
  security: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/CounselCertResultWebhookPayload.yaml
        example:
          msgKey: 20260424104234546POM101182450000
          userKey: USER_KEY_EXAMPLE
          senderKey: SENDER_KEY_EXAMPLE
          serviceType: CSTALK
          msgType: KAKAO_CERT
          requestType: cert_result
          sendTime: "2026-04-24T10:42:34.546+09:00"
          reportTime: "2026-04-24T10:42:35.120+09:00"
          kakaoTime: "2026-04-24T10:42:35.000+09:00"
          sessionId: SESSION_ID_EXAMPLE
          certTxId: CERT_TX_ID_EXAMPLE
          certResult: CERT_RESULT_ENCRYPTED_EXAMPLE
  responses:
    "200":
      description: 수신 성공 응답입니다.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/CounselWebhookAck.yaml
          example:
            code: A000
            result: Success
