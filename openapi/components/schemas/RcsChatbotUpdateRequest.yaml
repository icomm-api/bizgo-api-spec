type: object
description: 대화방 수정 요청(multipart/form-data)입니다. `chatbot`은 JSON 문자열 파트로 보냅니다.
required: [brandId, chatbot, subNumCertificate]
properties:
  brandId:
    type: string
    description: 수정할 대화방이 속한 브랜드 ID입니다.
    example: BRAND_ID_EXAMPLE
  chatbot:
    description: 수정할 대화방 정보입니다. 문서상 타입은 String(JSON 문자열)이며, JSON으로 직렬화해 한 파트로 보냅니다.
    x-unverified: "chatbot의 하위 필드가 모두 선택으로 표시되어 어떤 필드로 수정 대상을 식별하는지(chatbotId 필수 여부) 불명확합니다. status·approvalResult·registerDate처럼 서버가 정하는 값도 요청 필드로 나열되어 있습니다."
    allOf:
      - $ref: ./RcsChatbot.yaml
  subNumCertificate:
    type: string
    format: binary
    description: 부가번호 사용을 증명하는 서류 파일입니다.
    x-unverified: "부가번호를 바꾸지 않는 수정에도 필수인지 불명확합니다. 허용 형식·용량도 문서화되어 있지 않습니다."
