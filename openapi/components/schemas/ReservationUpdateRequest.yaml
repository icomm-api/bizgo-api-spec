type: object
description: 예약 수정 요청입니다. 예약 대기(PENDING) 상태인 예약 건의 발송 시각과 예약명만 바꿀 수 있습니다.
required: [resvSendTime]
properties:
  resvSendTime:
    type: string
    description: 변경할 예약 발송 시각입니다(yyyy-MM-dd HH:mm:ss).
    x-format: "yyyy-MM-dd HH:mm:ss"
    x-unverified: "수정 시 허용 형식(`T` 구분 형식 포함 여부)과 범위 제약(현재+10분~1년, 광고 야간 차단)이 등록 때와 같은지 문서에 없습니다."
    example: "2026-05-01 11:00:00"
  resvName:
    type: string
    description: 예약명입니다.
    maxLength: 100
