type: object
description: |
  상담톡 웹훅 수신 응답입니다. 리포트·MO 웹훅(`{"msgKey": ...}`)과 달리 `code`/`result`를 돌려줍니다.
  HTTP 200과 이 규격의 응답을 받아야 정상 처리되며, 응답이 없거나 규격이 다르면 최대 3회 재시도합니다.
properties:
  code:
    type: string
    description: 웹훅 처리 결과 코드입니다. 문서 예시 값은 `A000`입니다.
    example: A000
  result:
    type: string
    description: 웹훅 처리 결과 메시지입니다. 문서 예시 값은 `Success`입니다.
    example: Success
x-unverified: "code/result가 필수인지, A000 외의 code를 보내면 실패로 보고 재시도하는지 문서에 없습니다."
