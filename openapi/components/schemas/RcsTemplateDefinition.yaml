type: object
description: 등록·수정할 RCS 템플릿 정보입니다.
x-unverified: "템플릿 양식(messagebaseformId/formatId)을 지정하는 필드와, 수정 시 대상 템플릿(messagebaseId)을 지정하는 필드가 문서에 없습니다."
required: [brandId, templateName, body, buttons]
properties:
  brandId:
    type: string
    description: 브랜드 ID입니다.
    example: BRAND_ID_EXAMPLE
  templateName:
    type: string
    description: 템플릿 이름입니다.
  body:
    type: array
    description: 본문 영역 정의입니다.
    items:
      $ref: ./RcsTemplateBodyParam.yaml
  buttons:
    type: array
    description: 버튼 정의입니다.
    items:
      $ref: ./RcsTemplateButton.yaml
