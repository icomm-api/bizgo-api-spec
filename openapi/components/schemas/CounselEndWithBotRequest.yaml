type: object
description: 상담 종료 및 봇 전환 요청입니다.
required: [userKey, senderKey]
properties:
  userKey:
    type: string
    description: 상담톡 사용자 키입니다. 1~20자입니다.
    minLength: 1
    maxLength: 20
    example: USER_KEY_EXAMPLE
  senderKey:
    type: string
    description: 발신프로필 키입니다.
    example: SENDER_KEY_EXAMPLE
  botEvent:
    type: string
    description: 상담 종료 후 실행할 봇 이벤트(말블록)명입니다.
