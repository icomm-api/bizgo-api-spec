type: object
description: 상담 세션 정보입니다.
properties:
  sessionId:
    type: integer
    format: int64
    description: 세션 아이디입니다.
    x-unverified: "세션 조회 응답은 Integer, 웹훅의 sessionId는 String으로 문서가 타입을 다르게 적습니다."
  senderKey:
    type: string
    description: 발신프로필 키입니다.
  startedType:
    type: string
    description: 세션 시작 타입입니다. 문서 예시 값은 `UM`입니다.
    x-known-values: [UM]
    x-unverified: "startedType·expiredType 코드 목록과 의미가 문서에 없습니다."
  startedAt:
    type: string
    description: 세션 시작 시각입니다. 문서 예시는 오프셋 없는 ISO 8601 형식(`2025-09-24T11:22:08.557`)입니다.
    x-format: "yyyy-MM-dd'T'HH:mm:ss.SSS"
  expiredType:
    type: string
    description: 세션 종료 타입입니다. 문서 예시 값은 `AE`입니다.
    x-known-values: [AE]
  expiredAt:
    type: string
    description: 세션 종료 시각입니다. 현재 시각보다 크면 종료 예정 시각입니다(마지막 메시지 수신 시각 기준 다음 정각으로부터 30일 후).
    x-format: "yyyy-MM-dd'T'HH:mm:ss"
