type: object
description: 통합 발송 요청입니다. 모든 채널이 같은 형식을 쓰며, 채널은 `messageFlow` 안의 채널 키로 구분합니다.
required: [destinations, messageFlow]
properties:
  destinations:
    type: array
    description: 수신자 목록입니다. 한 요청에 최대 200건까지 동보발송할 수 있습니다(초과 시 A318).
    minItems: 1
    maxItems: 200
    items:
      $ref: ./Destination.yaml
  messageFlow:
    type: array
    description: 발송할 메시지 목록입니다. 순서대로 대체발송(Fallback)됩니다.
    minItems: 1
    items:
      $ref: ./MessageFlowItem.yaml
  paymentCode:
    type: string
    description: 정산용 부서 코드입니다.
  groupKey:
    type: string
    description: 메시지 인사이트에서 통계를 그룹으로 묶어 보기 위한 키입니다.
  idempotencyKey:
    type: string
    description: 중복 요청을 막는 멱등성 키입니다. 같은 키로 유효시간 안에 다시 요청하면 요청은 성공(HTTP 200)으로 오고 수신자별 결과(`destinations[].code`)가 A301이 됩니다(2026-09-28 sandbox 확인). SDK는 이 수신자를 실패가 아닌 `duplicates`로 돌려줍니다. 이 값을 보내면 `idempotencyTtl`도 함께 보내야 합니다.
    maxLength: 200
  idempotencyTtl:
    type: integer
    description: |
      멱등성 키 유효시간(초)입니다. 공개 문서는 선택 항목으로 표기하지만 `idempotencyKey`를 보내면 **반드시 함께 보내야 합니다**(없으면 A309).
      `idempotencyKey` 없이 이 값만 보내면 SDK는 받은 값을 그대로 보냅니다.
      공식 SDK는 `idempotencyKey`만 지정하고 이 값을 비워 두면 86400(24시간)을 채워 보냅니다. 직접 지정한 값(0 포함)은 그대로 보냅니다.
    minimum: 0
    maximum: 86400
    x-verified: "2026-09-28 sandbox: idempotencyKey만 보내고 idempotencyTtl을 빼면 data.code=A309, idempotencyTtl=600을 함께 보내면 TTL 검증 통과"
  ref:
    type: string
    description: 요청 단위 참조 필드입니다. 리포트에 그대로 담겨 요청·메시지를 구분하는 데 씁니다.
