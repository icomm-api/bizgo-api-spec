type: object
description: 메시지 발송 결과 리포트 1건입니다.
properties:
  msgKey:
    type: string
    description: 메시지 키입니다.
  serviceType:
    type: string
    description: 서비스 타입입니다.
    x-known-values: [SMS, MMS, RCS, ALIMTALK, BRANDMESSAGE]
  msgType:
    type: string
    description: 메시지 타입입니다(예 SM, RS, AT, FT).
  sendTime:
    type: string
    description: 전송 처리 일시입니다.
    x-format: "yyyy-MM-dd'T'HH:mm:ssXXX"
  reportTime:
    type: string
    description: 리포트 수신 일시입니다.
    x-format: "yyyy-MM-dd'T'HH:mm:ssXXX"
  reportType:
    type: string
    description: 리포트 종류입니다.
  reportCode:
    type: string
    description: 리포트 코드입니다. `10000`이면 성공입니다.
    example: "10000"
  reportText:
    type: string
    description: 리포트 상세 내용입니다.
  carrier:
    type: string
    description: (문자메시지) 이통사 코드입니다.
  userType:
    type: string
    description: (카카오 브랜드메시지) 메시지 발송 처리 타입입니다.
  resCnt:
    type: string
    description: (국제메시지) 메시지 분할 수입니다.
  ref:
    type: string
    description: 요청 시 입력한 참조 필드입니다.
