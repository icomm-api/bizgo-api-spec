type: object
description: |
  네이버 톡톡(네이버 스마트알림) 메시지입니다. `messageFlow[].navertalk` 객체로 보냅니다.
  네이버 스마트알림 규격에 맞춘 템플릿 기반 정보성 메시지입니다.

  수신번호 규칙(`destinations[].to`): 11자리 휴대폰 번호입니다(예: `01000000000`).
required: [partnerKey, templateCode, productCode]
properties:
  partnerKey:
    type: string
    description: 네이버 톡톡 파트너 키입니다(접수코드 A601).
    x-unverified: "원문 필드표는 partnerKey를 필수로 표시하지만, 리포트 코드 71005는 '파트너키나 발송그룹키(groupKey)가 반드시 있어야 합니다'로 둘 중 하나만 있어도 되는 것처럼 읽힙니다. 필드표(Part A)를 따라 필수로 둡니다."
    example: PARTNER_KEY_EXAMPLE
  templateCode:
    type: string
    description: 네이버 톡톡 템플릿 코드입니다.
    example: TEMPLATE_CODE_EXAMPLE
  productCode:
    type: string
    description: |
      템플릿의 상품 코드입니다. 등록된 템플릿의 상품 코드와 같아야 합니다(접수코드 A602, 리포트 코드 71007).
      원문 요청 예시 값은 `INFORMATION`이며, 전체 값 목록은 원문에 없습니다.
    x-known-values: [INFORMATION]
    example: INFORMATION
  userName:
    type: string
    description: 전화번호 소유자의 실명입니다.
  text:
    type: string
    description: 템플릿 본문입니다. 최대 2,048자입니다.
    maxLength: 2048
  templateParams:
    type: object
    description: 템플릿 치환 변수입니다. 치환할 키-값 쌍을 넣습니다. 최대 150자입니다.
    additionalProperties:
      type: string
    x-unverified: "원문은 'max: 150 chars'만 적혀 있어 값 하나당 150자인지, 전체 합계 150자인지 불명확합니다. 값의 타입(문자열)도 원문에 명시되지 않았습니다."
  attachments:
    $ref: ./NaverTalkAttachments.yaml
  groupKey:
    type: string
    description: 네이버 톡톡 발송 그룹입니다. 요청 최상위의 `groupKey`(메시지 인사이트 통계용)와는 다른 필드입니다.
