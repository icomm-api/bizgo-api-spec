allOf:
  - $ref: ./ServiceResult.yaml
  - type: object
    description: 발신프로필 목록 조회 개별부입니다. 페이지 정보와 목록이 `data.data`가 아닌 `data`에 바로 옵니다.
    x-unverified: "account 경로라 `data.data` 없이 `data.channels`로 문서화되어 있습니다. 이 엔드포인트는 한국어 페이지(Part A)에만 있습니다."
    properties:
      resultMsg:
        type: string
        description: 호출 결과 메시지입니다.
      page:
        type: integer
        description: 현재 페이지 번호입니다.
      totalPage:
        type: integer
        description: 전체 페이지 수입니다.
      totalCount:
        type: integer
        description: 전체 조회 건수입니다.
      hasNext:
        type: boolean
        description: 다음 페이지 존재 여부입니다.
      channels:
        type: array
        description: 발신프로필 목록입니다.
        items:
          $ref: ./KakaoSenderChannel.yaml
