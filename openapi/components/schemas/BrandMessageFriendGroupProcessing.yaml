type: object
description: "친구 그룹 등록·전화번호 추가·삭제 요청의 처리 정보입니다. 처리는 비동기이며 진행 상황은 전화번호 요청 조회 API로 확인합니다."
properties:
  friendGroupKey:
    type: string
    description: "친구 그룹 키입니다."
  requestId:
    type: string
    description: "요청 아이디입니다."
    example: "3930171852209730143"
    x-unverified: "Part A는 String, Part B는 Integer로 표기합니다. 예시 값이 int64 범위의 큰 수이므로 정밀도 손실을 피하려 Part A(String)를 따릅니다."
  status:
    type: string
    description: "친구 그룹 처리 상태입니다. 알려진 값: `IN_PROGRESS`, `COMPLETED`."
    x-known-values: [IN_PROGRESS, COMPLETED]
    example: COMPLETED
  createdAt:
    type: string
    description: "생성 일시(`yyyy-MM-dd HH:mm:ss`)입니다."
    x-format: "yyyy-MM-dd HH:mm:ss"
  modifiedAt:
    type: string
    description: "수정 일시(`yyyy-MM-dd HH:mm:ss`)입니다."
    x-format: "yyyy-MM-dd HH:mm:ss"
