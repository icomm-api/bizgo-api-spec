type: object
description: 예약 건에 등록된 수신자입니다.
properties:
  msgKey:
    type: string
    description: 메시지 키입니다. 수신자 삭제에 씁니다.
  destSeq:
    type: integer
    description: 수신자 순번입니다.
  to:
    type: string
    description: 수신번호입니다.
    example: "01000000000"
  destData:
    type: string
    description: 수신자별 치환 데이터입니다.
    x-unverified: "destData 형식이 불명확합니다. 요청은 replaceWords(JSON 객체)인데 응답 예시는 `name=홍길동` 형태의 문자열입니다."
  status:
    type: string
    description: 수신자 상태입니다. 알려진 값은 `PENDING`입니다.
    x-known-values: [PENDING]
    x-unverified: "수신자 상태 값 목록이 문서에 없습니다."
  responseCode:
    type: string
    description: 처리 결과 코드입니다.
  responseText:
    type: string
    description: 처리 결과 메시지입니다.
