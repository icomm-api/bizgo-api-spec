type: object
description: 현재 메타 정보가 없을 때 전달되는 가장 마지막 메타 정보입니다.
properties:
  extra:
    type: string
    description: 이전 상담 연결 버튼으로 전달된 메타 정보입니다.
  bot:
    type: string
    description: 상담을 어떻게 시작했는지 나타내는 값입니다. 문서 예시 값은 문자열 `false`입니다.
  bot_event:
    type: string
    description: 봇으로 상담을 시작했을 때 전달되는 봇 블록 이벤트 값입니다.
  created_at:
    type: string
    description: 마지막 메타 정보 생성 시각입니다.
    x-format: "yyyy-MM-dd'T'HH:mm:ss.SSSXXX"
