type: object
description: 브랜드메시지 와이드 아이템 목록의 항목 1개입니다.
properties:
  title:
    type: string
    description: 아이템 제목입니다. 첫 번째 아이템은 최대 25자(줄바꿈 1회), 2~4번째 아이템은 최대 30자(줄바꿈 1회)입니다.
    maxLength: 30
  imgUrl:
    type: string
    description: 아이템 이미지 URL입니다. 첫 번째 아이템은 와이드 리스트 첫번째 이미지 업로드, 2~4번째는 와이드 리스트 이미지 업로드로 발급받은 URL을 씁니다.
  urlMobile:
    type: string
    description: 모바일 클릭 URL입니다. 최대 1,000자입니다.
    maxLength: 1000
  urlPc:
    type: string
    description: PC 클릭 URL입니다. 최대 1,000자입니다.
    maxLength: 1000
  schemeIos:
    type: string
    description: iOS 커스텀 스킴입니다. 최대 1,000자입니다.
    maxLength: 1000
  schemeAndroid:
    type: string
    description: Android 커스텀 스킴입니다. 최대 1,000자입니다.
    maxLength: 1000
