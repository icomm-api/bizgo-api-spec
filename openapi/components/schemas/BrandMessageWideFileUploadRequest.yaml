type: object
required: [file]
properties:
  file:
    type: string
    format: binary
    description: 업로드할 브랜드메시지 이미지 파일입니다. 권장 크기 800×600px 또는 800×400px, 가로 500px 이상, 비율 0.5~1, 형식 jpg·png, 최대 5MB입니다.
    x-unverified: "이미지 규격(크기·비율·형식·용량)은 Copy Markdown(Part B)에만 있고 한국어 페이지(Part A)에는 없습니다."
  fileKey:
    type: string
    description: 업로드 파일을 식별하는 키입니다. 생략하면 서버가 자동으로 생성합니다.
    x-unverified: "한국어 페이지(Part A)에만 있고 Copy Markdown(Part B)에는 없는 필드입니다."
  imageName:
    type: string
    description: 업로드 파일의 이름입니다. 생략하면 확장자를 제외한 파일명을 사용합니다.
    x-unverified: "한국어 페이지(Part A)에만 있고 Copy Markdown(Part B)에는 없는 필드입니다."
