type: object
description: |
  알림톡 템플릿 등록·수정 요청의 템플릿 정보(`alimtalk`)입니다.
  이미지형·아이템리스트형 템플릿은 템플릿 이미지 업로드(`POST /file/alimtalk/template`)로 받은 `imgUrl`과 이름을 `imgUrl`, `imgName`에 넣습니다.
  버튼·바로연결·아이템 구조는 발송 규격의 `AlimtalkButton`, `AlimtalkQuickReply`, `AlimtalkItem` 등과 같습니다.
required: [senderKey, templateName, templateCode, templateMessageType, templateEmphasizeType, text]
properties:
  senderKey:
    type: string
    description: 카카오 비즈메시지 발신프로필 키입니다. `senderKeyType`이 `G`이면 그룹 키입니다.
    example: SENDER_KEY_EXAMPLE
  senderKeyType:
    type: string
    description: |
      발신프로필 키 타입입니다. 기본값은 `S`입니다.
      - `G`: 그룹
      - `S`: 발신프로필
    enum: [G, S]
    default: S
  templateName:
    type: string
    description: 템플릿 이름입니다. 최대 200자입니다.
    maxLength: 200
  templateCode:
    type: string
    description: 알림톡 템플릿 코드입니다. 최대 30자입니다.
    maxLength: 30
    example: TEMPLATE_CODE_EXAMPLE
  templateMessageType:
    type: string
    description: 템플릿 메시지 타입입니다. 문서 예시 값은 `BA`입니다.
    x-known-values: [BA]
    x-unverified: "템플릿 메시지 타입 코드 전체 목록이 문서에 없습니다."
    example: BA
  templateEmphasizeType:
    type: string
    description: 템플릿 강조 타입입니다. 문서 예시 값은 `NONE`입니다.
    x-known-values: [NONE]
    x-unverified: "템플릿 강조 타입 코드 전체 목록과 타입별 필수 필드(title, imgUrl, itemHighlight 등)가 문서에 없습니다."
    example: NONE
  text:
    type: string
    description: 알림톡 템플릿 본문입니다. 최대 1,300자이며 `#{변수}` 형식의 치환 변수를 쓸 수 있습니다.
    maxLength: 1300
  title:
    type: string
    description: 강조표기형 템플릿 제목입니다. 최대 50자입니다.
    maxLength: 50
  subTitle:
    type: string
    description: 강조 표기 보조 문구입니다.
  header:
    type: string
    description: 메시지 상단에 표시할 제목입니다.
  imgName:
    type: string
    description: 템플릿 이미지 파일 이름입니다.
    x-unverified: "이미지 업로드 응답은 `fileName`을 돌려주므로 `imgName`에 그 값을 그대로 넣는지 문서에 명시되지 않았습니다."
  imgUrl:
    type: string
    description: 템플릿 이미지 URL입니다. 템플릿 이미지 업로드 응답의 `imgUrl`을 씁니다.
  link:
    $ref: ./AlimtalkLink.yaml
  attachment:
    $ref: ./AlimtalkAttachment.yaml
  supplement:
    $ref: ./AlimtalkSupplement.yaml
  categoryCode:
    type: string
    description: 템플릿 카테고리 코드입니다. 템플릿 카테고리 전체 조회로 확인합니다.
  securityFlag:
    type: boolean
    description: 보안 템플릿 여부입니다.
  adultFlag:
    type: boolean
    description: 연령 인증 설정 여부입니다. 수신자가 연령 인증을 마치기 전까지 채팅방에서 메시지가 가려지며 만 20세 이상만 볼 수 있습니다. 기본값은 `false`입니다.
    default: false
  previewMessage:
    type: string
    description: 템플릿 미리보기 메시지입니다.
  extra:
    type: string
    description: 부가 정보입니다.
