type: object
required: [file]
properties:
  file:
    type: string
    format: binary
    description: 업로드할 RCS 이미지 파일입니다. jpg, bmp, png, gif 형식, 최대 1MB입니다.
    x-max-bytes: 1048576
    x-unverified: "형식·용량 제한(jpg/bmp/png/gif, 1MB)은 영문 문서에만 있습니다. 1MB가 1,000,000byte인지 1,048,576byte인지 불명확합니다."
  fileKey:
    type: string
    description: 업로드 파일을 식별하는 키입니다. 생략하면 서버가 생성합니다.
    x-unverified: "한국어 문서에만 있고 영문 문서에는 없는 필드입니다. 응답에는 fileKey가 아닌 media가 돌아옵니다."
  imageName:
    type: string
    description: 파일 이름입니다. 생략하면 확장자를 뺀 파일명을 씁니다.
    x-unverified: "한국어 문서에만 있고 영문 문서에는 없는 필드입니다."
