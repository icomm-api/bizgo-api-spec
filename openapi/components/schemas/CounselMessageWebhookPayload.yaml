description: 사용자 메시지 수신 웹훅(`{고객 Webhook URL}/cstalk/message`) 본문입니다. 사용자가 보낸 상담 내용이 담기므로 개인정보로 취급합니다.
allOf:
  - $ref: ./CounselWebhookCommon.yaml
  - type: object
    required: [msgKey, userKey, senderKey, serviceType, msgType, sendTime, reportTime]
    properties:
      msgType:
        type: string
        description: 메시지 타입입니다. 문서 예시 값은 `TEXT`입니다.
        x-known-values: [TEXT]
        x-unverified: "사용자 메시지의 msgType 값 목록이 문서에 없습니다."
      requestType:
        type: string
        description: 요청 타입입니다. 문서 예시 값은 `message`입니다. 이 웹훅에서만 필수가 아닙니다.
        x-known-values: [message]
      sessionId:
        type: string
        description: 상담 세션 ID입니다.
        x-unverified: "한국어 페이지(Part A)에만 있고 Copy Markdown(Part B)에는 없습니다."
      content:
        type: string
        description: 하위 호환을 위해 유지되는 본문 필드입니다. 2026년 1월 이후 제공되지 않으므로 `contents`를 사용합니다.
        deprecated: true
      extra:
        type: string
        description: 카카오가 전달한 부가 정보입니다.
        x-unverified: "한국어 페이지(Part A)에만 있고 Copy Markdown(Part B)에는 없습니다."
      contents:
        type: array
        description: 사용자가 전송한 메시지 데이터 배열입니다.
        items:
          $ref: ./CounselMessageContent.yaml
      attachment:
        $ref: ./CounselMessageAttachment.yaml
