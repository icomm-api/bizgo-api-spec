type: object
description: 카카오 채널 인증 토큰 요청 본문입니다.
required: [yellowId, phoneNumber]
properties:
  yellowId:
    type: string
    description: 카카오톡 채널 아이디입니다(`@`로 시작).
    example: "@KAKAO_CHANNEL_ID_EXAMPLE"
  phoneNumber:
    type: string
    description: 카카오톡 채널 알림을 받는 관리자 전화번호입니다. 이 번호에 연결된 카카오톡이 채널을 차단하지 않았으면 인증 토큰이 발송됩니다.
    example: "01000000000"
