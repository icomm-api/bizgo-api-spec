type: object
description: "발신프로필 무료수신거부 정보 입력 요청입니다."
required: [brandmessage]
properties:
  brandmessage:
    type: object
    description: "무료수신거부 정보입니다."
    required: [senderKey, unsubscribePhoneNumber]
    properties:
      senderKey:
        type: string
        description: "발신프로필 키입니다."
        example: SENDER_KEY_EXAMPLE
      unsubscribePhoneNumber:
        type: string
        description: "무료수신거부 전화번호입니다."
        example: "080-0000-0000"
        x-unverified: "하이픈 포함 여부·길이 제한이 문서에 없습니다(예시는 하이픈 포함). 발송 규격의 같은 필드는 최대 13자입니다."
      unsubscribeAuthNumber:
        type: string
        description: "무료수신거부 인증번호입니다."
        example: "12345"
