type: object
description: |
  템플릿 버튼 액션 객체입니다. 발송용 `RcsSuggestion`과 달리 `displayText`가 `action` 안에 있고,
  클립보드 복사 액션(`clipboardAction`)을 쓸 수 있습니다.
x-unverified: "한 action에 액션 유형을 하나만 넣어야 하는지 문서에 명시되어 있지 않습니다."
required: [displayText]
properties:
  displayText:
    type: string
    description: 버튼 표시 텍스트입니다.
  clipboardAction:
    $ref: ./RcsTemplateClipboardAction.yaml
  urlAction:
    $ref: ./RcsUrlAction.yaml
  dialerAction:
    $ref: ./RcsDialerAction.yaml
  mapAction:
    $ref: ./RcsTemplateMapAction.yaml
  calendarAction:
    $ref: ./RcsCalendarAction.yaml
  composeAction:
    $ref: ./RcsTemplateComposeAction.yaml
