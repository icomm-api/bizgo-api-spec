type: object
description: |
  조회·등록·수정 응답의 알림톡 템플릿 정보입니다. 응답에는 요청 필드 외에 검수 상태, 차단·휴면 여부, 심사 의견 등이 더해집니다.
  응답에 따라 일부 필드만 올 수 있습니다.
properties:
  senderKey:
    type: string
    description: 발신프로필 키입니다.
    example: SENDER_KEY_EXAMPLE
  senderKeyType:
    type: string
    description: |
      발신프로필 키 타입입니다. 기본값은 `S`입니다.
      - `G`: 그룹
      - `S`: 발신프로필
    enum: [G, S]
  templateName:
    type: string
    description: 템플릿 이름입니다.
  templateCode:
    type: string
    description: 템플릿 코드입니다.
    example: TEMPLATE_CODE_EXAMPLE
  msgType:
    type: string
    description: |
      이 템플릿으로 발송할 때 쓰는 카카오 비즈메시지 타입입니다(`AT` 텍스트형, `AI` 이미지형).
      전문 발송의 `AlimtalkMessage.msgType`에 그대로 넣습니다. 필드 표에는 없지만 응답에 옵니다(2026-09-28 sandbox 확인).
    x-known-values: [AT, AI]
    x-verified: "2026-09-28 sandbox: alimtalk 템플릿 조회 응답에 msgType이 옴"
    example: AT
  templateMessageType:
    type: string
    description: 템플릿 메시지 타입입니다. 문서 예시 값은 `BA`입니다.
    x-known-values: [BA]
  templateEmphasizeType:
    type: string
    description: 템플릿 강조 타입입니다. 문서 예시 값은 `NONE`입니다.
    x-known-values: [NONE]
  text:
    type: string
    description: 템플릿 본문입니다.
  title:
    type: string
    description: 강조표기형 템플릿 제목입니다.
  subTitle:
    type: string
    description: 강조 표기 보조 문구입니다.
  header:
    type: string
    description: 메시지 상단에 표시할 제목입니다.
  imgName:
    type: string
    description: 이미지 이름입니다.
  imgUrl:
    type: string
    description: 이미지 URL입니다.
  link:
    $ref: ./AlimtalkLink.yaml
  attachment:
    $ref: ./AlimtalkAttachment.yaml
  supplement:
    $ref: ./AlimtalkSupplement.yaml
  categoryCode:
    type: string
    description: 템플릿 카테고리 코드입니다.
  securityFlag:
    type: boolean
    description: 보안 템플릿 여부입니다.
  adultFlag:
    type: boolean
    description: 연령 인증 설정 여부입니다.
  previewMessage:
    type: string
    description: 템플릿 미리보기 메시지입니다.
  extra:
    type: string
    description: 부가 정보입니다.
  inspectionStatus:
    type: string
    description: |
      검수 상태입니다.
      - `REG`: 등록
      - `REQ`: 검수 요청
      - `APR`: 승인
      - `REJ`: 반려
    enum: [REG, REQ, APR, REJ]
    x-unverified: "검수 상태 값 목록은 Copy Markdown(Part B)에만 있습니다."
  status:
    type: string
    description: 템플릿 상태입니다. 목록 조회·최근 변경 템플릿 조회 응답에 있습니다.
    x-unverified: "값 목록이 문서에 없고, 목록 조회 예시는 `A`, 최근 변경 조회 예시는 `APR`로 서로 다릅니다. 검수 요청 문서는 '템플릿 상태가 대기'일 때 요청 가능하다고 하나 대기에 해당하는 코드가 없습니다."
  block:
    type: string
    description: 템플릿 차단 여부입니다. `true` 또는 `false` 문자열입니다.
    x-known-values: ["true", "false"]
    x-unverified: "문서상 타입이 Boolean이 아닌 String입니다(발신프로필의 block은 Boolean)."
  dormant:
    type: string
    description: 템플릿 휴면 여부입니다. `true` 또는 `false` 문자열입니다.
    x-known-values: ["true", "false"]
    x-unverified: "문서상 타입이 Boolean이 아닌 String입니다(발신프로필의 dormant는 Boolean)."
  createdAt:
    type: string
    description: 생성일입니다.
    x-unverified: "날짜 형식이 문서에 없습니다."
  modifiedAt:
    type: string
    description: 수정일입니다.
    x-unverified: "날짜 형식이 문서에 없습니다."
  comments:
    type: array
    description: 템플릿 심사 의견 목록입니다.
    items:
      $ref: ./AlimtalkTemplateComment.yaml
