type: object
description: "친구 그룹 상세 정보입니다. 동보 발송에 쓰려면 상태가 완료이고 `userCount`가 10 이상이어야 합니다."
properties:
  friendGroupKey:
    type: string
    description: "친구 그룹 키입니다."
  userCount:
    type: integer
    description: "등록 유저 수입니다."
  friendCount:
    type: integer
    description: "친구 수입니다. `status`가 `IN_PROGRESS`이면 없을 수 있습니다."
  status:
    type: string
    description: "친구 그룹 처리 상태입니다. 알려진 값: `IN_PROGRESS`, `COMPLETED`."
    x-known-values: [IN_PROGRESS, COMPLETED]
    example: COMPLETED
    x-unverified: "동보 발송 안내는 그룹 상태를 `C`(Completed)로 표기하지만 응답 값은 `COMPLETED`입니다. 같은 값인지 확인이 필요합니다."
  createdAt:
    type: string
    description: "생성 일시(`yyyy-MM-dd HH:mm:ss`)입니다."
    x-format: "yyyy-MM-dd HH:mm:ss"
  modifiedAt:
    type: string
    description: "수정 일시(`yyyy-MM-dd HH:mm:ss`)입니다."
    x-format: "yyyy-MM-dd HH:mm:ss"
