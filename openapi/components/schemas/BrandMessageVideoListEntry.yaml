type: object
description: "동영상 업로드 이력 1건입니다."
properties:
  vid:
    type: string
    description: "동영상 식별자입니다."
  senderKey:
    type: string
    description: "발신프로필 키입니다."
  fileName:
    type: string
    description: "업로드한 파일 이름입니다."
  fileSize:
    type: integer
    description: "업로드한 파일 크기(byte)입니다."
    format: int64
  status:
    type: string
    description: "동영상 처리 상태입니다. 알려진 값: `REGISTERED`(업로드 등록됨), `ENCODING`(인코딩 중), `PUBLIC`(공개, 발송·템플릿 등록 가능), `PRIVATE`(비공개, 템플릿 등록만 가능), `VIOLATED`(정책 위반), `ILLEGAL`(불법촬영물), `DELETED`(삭제됨), `ERROR`(업로드·인코딩 오류)."
    x-known-values: [REGISTERED, ENCODING, PUBLIC, PRIVATE, VIOLATED, ILLEGAL, DELETED, ERROR]
  title:
    type: string
    description: "동영상 제목입니다."
  thumbnailUrl:
    type: string
    description: "동영상 썸네일 URL입니다. 처리 실패 시 빈 값입니다."
  videoUrl:
    type: string
    description: "동영상 재생 URL입니다. 처리 실패 시 빈 값입니다."
  modifiedAt:
    type: string
    description: "카카오 기준 최종 변경 일시(`yyyy-MM-dd HH:mm:ss`)입니다. 처리 실패 시 반환되지 않습니다."
    x-format: "yyyy-MM-dd HH:mm:ss"
  regDate:
    type: string
    description: "업로드 등록 일시(`yyyy-MM-dd HH:mm:ss`)입니다."
    x-format: "yyyy-MM-dd HH:mm:ss"
  updateDate:
    type: string
    description: "최종 갱신 일시(`yyyy-MM-dd HH:mm:ss`)입니다."
    x-format: "yyyy-MM-dd HH:mm:ss"
