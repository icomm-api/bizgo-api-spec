type: object
description: 시스템 메시지 검수 결과 또는 문의입니다.
properties:
  id:
    type: string
    description: 댓글 아이디입니다.
  content:
    type: string
    description: 댓글 내용입니다.
  userName:
    type: string
    description: 작성자입니다.
  createdAt:
    type: string
    description: 등록일입니다.
    x-format: "yyyy-MM-dd HH:mm:ss"
  status:
    type: string
    description: 상태입니다. `APR` 승인, `REJ` 반려, `INQ` 문의입니다.
    enum: [APR, REJ, INQ]
