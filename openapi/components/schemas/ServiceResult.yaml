type: object
description: 상품 API 처리 결과(개별부)입니다.
required: [code, result]
properties:
  code:
    type: string
    description: 처리 결과 코드입니다. `A000`이면 성공입니다. 코드 목록은 에러코드 문서를 참고합니다.
    example: A000
  result:
    type: string
    description: 처리 결과 설명입니다.
    example: Success
  ref:
    type: string
    description: 요청 시 전달한 참조값입니다.
