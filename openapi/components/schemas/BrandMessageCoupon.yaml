type: object
description: 브랜드메시지 쿠폰 요소입니다.
required: [title, description]
properties:
  title:
    type: string
    description: "쿠폰명입니다. `${n}원 할인`, `${n}% 할인`, `배송비 할인`, `${7자 이내} 무료`, `${7자 이내} UP` 형식을 지원합니다."
  description:
    type: string
    description: 쿠폰 상세 정보입니다. 와이드(FW)·와이드 리스트(FL)·프리미엄 동영상(FP)은 최대 18자, 그 외(캐러셀 아이템 포함)는 최대 12자입니다.
    maxLength: 18
  urlPc:
    type: string
    description: PC 클릭 URL입니다.
  urlMobile:
    type: string
    description: 모바일 클릭 URL입니다.
  schemeAndroid:
    type: string
    description: Android 커스텀 스킴입니다.
  schemeIos:
    type: string
    description: iOS 커스텀 스킴입니다.
