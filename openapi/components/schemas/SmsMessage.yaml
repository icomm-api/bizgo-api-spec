type: object
description: SMS(단문) 메시지입니다. 제목 필드는 없습니다.
required: [from, text]
properties:
  from:
    type: string
    description: 발신번호입니다. 비즈고에 미리 등록한 번호여야 합니다.
    example: "01000000000"
  text:
    type: string
    description: SMS 본문입니다. 최대 90byte이며, 이통사 규격상 EUC-KR 범위 밖 문자는 접수 오류가 날 수 있습니다.
    x-max-bytes: 90
    x-charset: EUC-KR
  ttl:
    type: string
    description: 이통사 전달까지 유효한 최대 시간(초)입니다. 시간이 지나면 실패 처리됩니다.
    pattern: "^[0-9]+$"
  originCID:
    type: string
    description: 최초 발신사업자 식별코드(9자리)입니다. 일반 고객은 입력하지 않습니다.
