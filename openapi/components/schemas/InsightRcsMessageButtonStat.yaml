type: object
description: RCS 메시지 버튼 클릭 일자별 통계 1건(카드 단위)입니다.
properties:
  statDate:
    type: string
    description: 통계 일자(yyyyMMdd)입니다.
    x-format: yyyyMMdd
    example: "20260801"
  corpId:
    type: string
    description: 기업 ID입니다.
  corpRegNum:
    type: string
    description: 사업자등록번호입니다.
  brandId:
    type: string
    description: RCS 브랜드 ID입니다.
    example: BRAND_ID_EXAMPLE
  chatbotId:
    type: string
    description: 챗봇 ID입니다.
  groupId:
    type: string
    description: 그룹 ID입니다.
  messagebaseId:
    type: string
    description: 메시지베이스 ID입니다.
  reactionType:
    type: string
    description: 반응 유형입니다. 알려진 값은 `button`입니다.
    x-known-values: [button]
  cardNum:
    type: integer
    description: 카드 번호입니다.
  buttonList:
    type: array
    description: 버튼별 클릭 상세입니다.
    items:
      $ref: ./InsightRcsButtonClick.yaml
