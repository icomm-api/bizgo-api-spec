type: object
description: 캐러셀 인트로 정보입니다. FC 타입에서는 사용할 수 없습니다.
properties:
  header:
    type: string
    description: 캐러셀 인트로 헤더입니다. 줄바꿈 불가, 최대 20자입니다.
    maxLength: 20
  content:
    type: string
    description: 캐러셀 인트로 내용입니다. 줄바꿈 최대 2회, 최대 50자입니다.
    maxLength: 50
  imageUrl:
    type: string
    description: 캐러셀 인트로 이미지 URL입니다.
  urlMobile:
    type: string
    description: 모바일 클릭 URL입니다. URL 또는 스킴 중 하나라도 입력하면 필수입니다. 최대 1,000자입니다.
    maxLength: 1000
  urlPc:
    type: string
    description: PC 클릭 URL입니다. 최대 1,000자입니다.
    maxLength: 1000
  schemeAndroid:
    type: string
    description: Android 커스텀 스킴입니다. 최대 1,000자입니다.
    maxLength: 1000
  schemeIos:
    type: string
    description: iOS 커스텀 스킴입니다. 최대 1,000자입니다.
    maxLength: 1000
