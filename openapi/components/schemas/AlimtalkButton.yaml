type: object
description: 알림톡 버튼입니다. 버튼 타입에 따라 필요한 필드가 다릅니다.
required: [type, name]
properties:
  type:
    type: string
    description: 카카오 버튼 타입 코드입니다. 문서 예시에 나온 값은 `WL`(웹 링크)입니다.
    x-known-values: [WL]
    x-unverified: "버튼 타입 코드 전체 목록과 타입별 필수 필드가 문서에 없습니다."
    example: WL
  name:
    type: string
    description: 카카오 버튼명입니다.
  urlPc:
    type: string
    description: PC 환경에서 버튼 클릭 시 이동할 URL입니다.
  urlMobile:
    type: string
    description: 모바일 환경에서 버튼 클릭 시 이동할 URL입니다.
  schemeIos:
    type: string
    description: iOS 환경에서 버튼 클릭 시 실행할 커스텀 스킴입니다.
  schemeAndroid:
    type: string
    description: Android 환경에서 버튼 클릭 시 실행할 커스텀 스킴입니다.
  target:
    type: string
    description: 웹 링크 버튼의 target 값입니다. `type`이 `WL`이고 `target`이 `out`이면 아웃링크로 동작합니다.
  chatExtra:
    type: string
    description: 봇/상담톡 전환 시 전달할 메타 정보입니다.
  chatEvent:
    type: string
    description: 봇/상담톡 전환 시 연결할 이벤트명입니다.
  pluginId:
    type: string
    description: 비즈플러그인 ID입니다.
  relayId:
    type: string
    description: 비즈플러그인 relay ID입니다. 비즈플러그인 실행 시 `X-Kakao-Plugin-Relay-Id` 헤더로 전달됩니다.
  oneclickId:
    type: string
    description: 원클릭 결제 정보 ID입니다.
  productId:
    type: string
    description: 원클릭 결제 상품 ID입니다.
  bizFormKey:
    type: string
    description: 비즈폼 키입니다.
  bizFormId:
    type: string
    description: 비즈폼 ID입니다.
  telNumber:
    type: string
    description: 전화번호입니다.
