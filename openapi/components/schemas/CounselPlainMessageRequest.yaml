type: object
description: |
  상담톡 Plain 메시지 발송 요청입니다. 상담 세션이 열려 있는 사용자에게만 보낼 수 있습니다.
  본문(`message`)과 첨부는 최종 사용자와의 상담 내용이므로 개인정보로 취급하고 로그에 남기지 않습니다.
required: [userKey, senderKey, msgType, message]
x-sdk-required-if:
  - when: { field: msgType, equals: FILE }
    requiredPaths: [attachment.file.fileName, attachment.file.fileSize]
properties:
  userKey:
    type: string
    description: 상담톡 사용자 키입니다. 카카오톡 채널별로 다르며 대소문자를 구분합니다. 1~20자이며 비어 있거나 20자를 넘으면 `A507`이 반환됩니다.
    minLength: 1
    maxLength: 20
    example: USER_KEY_EXAMPLE
  senderKey:
    type: string
    description: 발신프로필 키입니다.
    example: SENDER_KEY_EXAMPLE
  msgType:
    type: string
    description: 메시지 타입입니다. IMAGE는 `attachment.image`, VIDEO·AUDIO·FILE은 `attachment.file`을 사용합니다.
    enum: [TEXT, IMAGE, VIDEO, AUDIO, FILE]
  message:
    type: string
    description: 사용자에게 전달할 메시지입니다. 최대 1,000자입니다.
    maxLength: 1000
  attachment:
    $ref: ./CounselPlainAttachment.yaml
  ref:
    type: string
    description: 참조 필드입니다. 최대 200자이며 발송 결과 웹훅(`cstalk/result`)에서 함께 반환됩니다.
    maxLength: 200
