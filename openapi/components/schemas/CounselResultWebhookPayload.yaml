description: |
  발송 결과 수신 웹훅(`{고객 Webhook URL}/cstalk/result`) 본문입니다. Plain/Rich 발송과 상담 종료 요청의 처리 결과가 전달되며,
  `msgKey`·`ref`로 발송 건과 대조합니다.
allOf:
  - $ref: ./CounselWebhookCommon.yaml
  - type: object
    required: [msgKey, userKey, senderKey, serviceType, requestType, sendTime, reportTime]
    properties:
      msgKey:
        type: string
        description: 발송 API 응답으로 받은 메시지 키입니다.
      requestType:
        type: string
        description: 요청 타입입니다. `write`(메시지 발송), `end`(상담 종료), `endwithbot`(상담 종료 및 봇 전환) 중 하나입니다.
        enum: [write, end, endwithbot]
      reportCode:
        type: string
        description: 발송 결과 코드입니다. 카카오 응답 코드를 비즈고 코드로 변환한 값이며 `A000`이면 성공입니다.
      reportText:
        type: string
        description: 리포트 메시지입니다.
      kakaoResCreatedAt:
        type: string
        description: 카카오 응답 생성 일시입니다(ISO 8601).
        x-format: "yyyy-MM-dd'T'HH:mm:ss.SSSXXX"
        x-unverified: "한국어 페이지(Part A)에만 있고 Copy Markdown(Part B)에는 없습니다."
      ref:
        type: string
        description: 발송 요청 시 전달한 참조 필드입니다.
