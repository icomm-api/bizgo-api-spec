type: object
required: [file, senderKey]
properties:
  file:
    type: string
    format: binary
    description: 업로드할 파일 바이너리입니다. 운영 환경은 최대 300MB, 샌드박스는 최대 10MB입니다.
    x-unverified: "용량 상한(300MB/10MB)은 한국어 페이지(Part A)에만 있고, 허용 확장자와 MB 기준(10^6/2^20 byte)이 문서에 없습니다."
  fileKey:
    type: string
    description: 업로드 파일을 식별하는 키입니다. 생략하면 서버가 자동으로 생성합니다.
    x-unverified: "한국어 페이지(Part A)에만 있고 Copy Markdown(Part B)에는 없는 필드입니다."
  imageName:
    type: string
    description: 업로드 파일의 이름입니다. 생략하면 확장자를 제외한 파일명을 사용합니다.
    x-unverified: "한국어 페이지(Part A)에만 있고 Copy Markdown(Part B)에는 없는 필드입니다."
  senderKey:
    type: string
    description: 카카오 비즈메시지 발신프로필 키입니다.
  fileType:
    type: string
    description: 파일 타입입니다. `file`은 일반 파일, `audio`는 오디오 파일, `video`는 비디오 파일입니다.
    enum: [file, audio, video]
