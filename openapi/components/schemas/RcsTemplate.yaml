type: object
description: RCS 템플릿 상세 정보입니다.
x-unverified: "approvalResult 예시가 목록 조회(approved)와 상세 조회(승인)에서 다릅니다. 일시 형식이 문서화되어 있지 않습니다. 응답에 messagebaseId·templateName·brandId·buttons가 없습니다."
properties:
  status:
    type: string
    description: 템플릿 상태입니다.
  approvalResult:
    type: string
    description: 승인 결과입니다.
  approvalReason:
    type: string
    description: 승인 사유입니다.
  registerDate:
    type: string
    description: 등록일시입니다.
  approvalDate:
    type: string
    description: 승인일시입니다.
  updateDate:
    type: string
    description: 수정일시입니다.
  registerId:
    type: string
    description: 등록 계정 ID입니다.
  updateId:
    type: string
    description: 수정 계정 ID입니다.
  productCode:
    type: string
    description: 상품 코드입니다. 문서 예시 값은 `lms`입니다.
  spec:
    type: string
    description: 템플릿 스펙입니다. 문서 예시 값은 `openrichcard`입니다.
  cardType:
    type: string
    description: 카드 종류입니다. 문서 예시 값은 `descriptionNew`입니다.
  body:
    $ref: ./RcsTemplateDetailBody.yaml
  brandKey:
    type: string
    description: 브랜드 키입니다.
    example: RCS_BRAND_KEY
  formatId:
    type: string
    description: 템플릿 양식 ID입니다. 발송 시에는 이 값을 `formatId` 필드에 넣습니다(영문 문서 기준).
    x-unverified: "영문 문서는 messagebaseId와 formatId 모두 발송 시 formatId 필드에 넣는다고 설명해 어느 값을 써야 하는지 불명확합니다."
