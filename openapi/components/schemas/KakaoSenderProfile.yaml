type: object
description: |
  카카오 비즈메시지 발신프로필 정보입니다.
  발신프로필 등록(`POST /account/kakao/sender`), uuid·senderKey 조회(`GET /account/kakao/sender`),
  발신프로필 키로 조회(`GET /center/kakao/sender`) 응답에서 함께 씁니다. 엔드포인트마다 포함되는 필드가 조금씩 다릅니다.
properties:
  senderKey:
    type: string
    description: 발신프로필 키입니다.
    example: SENDER_KEY_EXAMPLE
  uuid:
    type: string
    description: 카카오톡 채널 아이디(uuid)입니다. `@`로 시작하는 카카오톡 채널 검색용 아이디입니다.
    x-unverified: "account 경로 응답 예시는 `@`로 시작하는 채널 아이디, center 경로 응답 예시는 UUID 형식 문자열로 서로 다릅니다."
    example: "@KAKAO_CHANNEL_ID_EXAMPLE"
  name:
    type: string
    description: 카카오톡 채널 프로필명입니다.
  status:
    type: string
    description: 발신프로필 상태값입니다. 알려진 값은 `A`(정상)입니다.
    x-known-values: [A]
  block:
    type: boolean
    description: 발신프로필 차단 여부입니다.
  dormant:
    type: boolean
    description: 발신프로필 휴면 여부입니다. 휴면이면 휴면 해제(`POST /center/kakao/sender/recover`)로 복구합니다.
  profileStatus:
    type: string
    description: |
      카카오톡 채널 상태입니다.
      - `A`: activated
      - `C`: deactivated
      - `B`: block
      - `E`: deleting
    enum: [A, C, B, E]
    x-unverified: "상태값 목록은 Copy Markdown(Part B)에만 있습니다."
  createdAt:
    type: string
    description: 등록일입니다.
    x-format: "yyyy-MM-dd HH:mm:ss"
    x-unverified: "account 경로 응답 예시는 `yyyy-MM-dd HH:mm:ss`, center 경로 응답 예시는 `yyyy-MM-dd'T'HH:mm:ssXXX` 형식으로 서로 다릅니다."
  modifiedAt:
    type: string
    description: 최종 수정일입니다. 형식은 `createdAt`과 같습니다.
    x-format: "yyyy-MM-dd HH:mm:ss"
    x-unverified: "createdAt과 같은 형식 불일치가 있습니다."
  categoryCode:
    type: string
    description: 발신프로필 카테고리 코드(11자리 숫자)입니다.
  bizchat:
    type: boolean
    description: 상담톡 사용 여부입니다. 조회 응답에만 있고 등록 응답에는 없습니다.
  brandtalk:
    type: boolean
    description: 브랜드톡 사용 여부입니다. account 경로 응답에만 있습니다.
  brandMessage:
    type: boolean
    description: 브랜드메시지 타겟팅 사용 여부입니다.
    x-unverified: "account 경로 문서는 타겟팅 M·N·O, center 경로 문서는 M·N 사용 여부로 설명합니다."
  committalCompanyName:
    type: string
    description: 상담톡 위탁사 이름입니다. 조회 응답에만 있습니다.
  channelKey:
    type: string
    description: 메시지 발송 결과 수신 채널키입니다.
  businessProfile:
    type: boolean
    description: 카카오톡 채널 비즈니스 인증 여부입니다.
  businessType:
    type: string
    description: 비즈니스 유형입니다. 알려진 값은 `BUSINESS`입니다. account 경로 응답에만 있습니다.
    x-known-values: [BUSINESS]
  unsubscribePhoneNumber:
    type: string
    description: 무료수신거부 전화번호입니다.
  unsubscribeAuthNumber:
    type: string
    description: 무료수신거부 인증번호입니다.
  profileSpamLevel:
    type: string
    description: |
      카카오톡 채널 스팸 상태입니다. 정상 / 경고제한(프로필 초기화, 상담·발송 가능) / 영구제한(상담·발송 불가)입니다.
      문서 예시 값은 `정상`입니다.
    x-known-values: [정상]
    x-unverified: "정상 외 상태의 실제 문자열 값이 문서에 없습니다(Part B 영문 설명만 있음)."
  profileMessageSpamLevel:
    type: string
    description: |
      카카오톡 메시지 스팸 상태입니다. 정상 / 경고제한(상담·발송 가능) / 활동제한(상담 가능, 발송 불가)입니다.
      문서 예시 값은 `정상`입니다.
    x-known-values: [정상]
    x-unverified: "정상 외 상태의 실제 문자열 값이 문서에 없습니다(Part B 영문 설명만 있음)."
  clearBlockUrl:
    type: string
    description: 알림톡 차단 해제 링크입니다.
