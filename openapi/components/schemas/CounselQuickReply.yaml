type: object
description: 상담톡 바로연결입니다.
required: [type, name]
properties:
  type:
    type: string
    description: 카카오 바로연결 타입 코드입니다.
    x-unverified: "바로연결 타입 코드 목록이 문서에 없습니다."
  name:
    type: string
    description: 바로연결 제목입니다. 최대 14자입니다.
    maxLength: 14
  urlPc:
    type: string
    description: PC 환경에서 버튼 클릭 시 이동할 URL입니다.
  urlMobile:
    type: string
    description: 모바일 환경에서 버튼 클릭 시 이동할 URL입니다.
  schemeIos:
    type: string
    description: iOS 환경에서 버튼 클릭 시 실행할 커스텀 스킴입니다.
  schemeAndroid:
    type: string
    description: Android 환경에서 버튼 클릭 시 실행할 커스텀 스킴입니다.
  urlTarget:
    type: string
    description: 외부 브라우저로 열려면 `out`을 입력합니다.
    x-known-values: [out]
  extra:
    type: string
    description: BK 버튼 발송 또는 상담톡/챗봇 전환 시 전달할 메타 정보입니다.
  chatEvent:
    type: string
    description: 봇 전환 시 연결할 봇 이벤트명입니다.
