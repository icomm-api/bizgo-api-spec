type: object
description: 대상 발신프로필과 사용자입니다.
required: [senderKey, userKey]
properties:
  senderKey:
    type: string
    description: 발신프로필 키입니다.
    example: SENDER_KEY_EXAMPLE
  userKey:
    type: string
    description: 대상 사용자 키입니다. 1~20자입니다.
    minLength: 1
    maxLength: 20
    example: USER_KEY_EXAMPLE
